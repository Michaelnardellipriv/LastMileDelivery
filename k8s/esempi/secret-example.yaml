# ESEMPIO con valori finti: mostra quali chiavi servono, NON va applicato così.
# Sta in k8s/esempi/ apposta: non fa parte di nessun ambiente (k8s/test, k8s/prod),
# quindi kubectl apply -k non sovrascrive mai i Secret veri con questi valori.
# In PROD gli stessi comandi con -n lastmile-prod.
#
# I Secret veri si creano a mano da chi ha accesso al cluster (valori mai nel repository):
#
#   kubectl create secret generic db-secret \
#     --from-literal=POSTGRES_USER=lastmile --from-literal=POSTGRES_PASSWORD=<password> \
#     --from-literal=POSTGRES_DB=lastmile \
#     --from-literal=APP_DB_USER=lastmile_app --from-literal=APP_DB_PASSWORD=<password-app>
#   kubectl create secret generic backend-comune-secret \
#     --from-literal=JWT_SEGRETO=<almeno-32-caratteri-casuali> \
#     --from-literal=CHIAVE_INTERNA=<altri-32-caratteri-casuali>
#   kubectl create secret generic utenti-secret \
#     --from-literal=DATABASE_URL="postgres://lastmile_app:<password-app>@db-globale-svc:5432/lastmile?sslmode=disable"
#   kubectl create secret generic spedizioni-secret \
#     --from-literal=DATABASE_URL="postgres://lastmile_app:<password-app>@db-spedizioni-svc:5432/lastmile?sslmode=disable"
#   (con un gruppo di sedi in più, anche
#     --from-literal=DATABASE_URL_1="postgres://lastmile_app:<password-app>@db-spedizioni-1-svc:5432/lastmile?sslmode=disable";
#    su un Secret già creato si aggiunge con kubectl patch, vedi k8s/esempi/gruppo-spedizioni-1.yaml)
#
# "base64 non è cifratura": un Secret si legge con kubectl get secret -o yaml.

# Usato dai due database (immagini db-globale e db-spedizioni): crea il database e
# l'utente del backend. I database sono due, separati, con le stesse credenziali.
apiVersion: v1
kind: Secret
metadata:
  name: db-secret
type: Opaque
stringData:
  POSTGRES_USER: "POSTGRES_USER"
  POSTGRES_PASSWORD: "POSTGRES_PASSWORD"
  POSTGRES_DB: "POSTGRES_DB"
  # utente normale del backend (lo crea il database al primo avvio): niente superutente,
  # così la Row-Level Security sulle sedi vale anche per il servizio spedizioni
  APP_DB_USER: "APP_DB_USER"
  APP_DB_PASSWORD: "APP_DB_PASSWORD"
---
# Uguale per i due microservizi.
apiVersion: v1
kind: Secret
metadata:
  name: backend-comune-secret
type: Opaque
stringData:
  # il servizio utenti firma i token, il servizio spedizioni li verifica: stesso segreto
  JWT_SEGRETO: "ALMENO_32_CARATTERI_CASUALI_____"
  # protegge le chiamate /interno tra i due servizi
  CHIAVE_INTERNA: "ALTRI_32_CARATTERI_CASUALI______"
---
# Servizio utenti: il database globale.
apiVersion: v1
kind: Secret
metadata:
  name: utenti-secret
type: Opaque
stringData:
  DATABASE_URL: "postgres://APP_DB_USER:APP_DB_PASSWORD@db-globale-svc:5432/POSTGRES_DB?sslmode=disable"
---
# Servizio spedizioni: i database delle spedizioni, uno per gruppo di sedi.
apiVersion: v1
kind: Secret
metadata:
  name: spedizioni-secret
type: Opaque
stringData:
  # gruppo 0 (il principale): c'è sempre
  DATABASE_URL: "postgres://APP_DB_USER:APP_DB_PASSWORD@db-spedizioni-svc:5432/POSTGRES_DB?sslmode=disable"
  # FACOLTATIVA, solo se esiste il database del gruppo 1 (k8s/esempi/gruppo-spedizioni-1.yaml):
  # con la chiave e senza il database il servizio parte, ma le sedi del gruppo 1 hanno 503.
  # Il gruppo 2 sarà DATABASE_URL_2, e così via.
  # DATABASE_URL_1: "postgres://APP_DB_USER:APP_DB_PASSWORD@db-spedizioni-1-svc:5432/POSTGRES_DB?sslmode=disable"
