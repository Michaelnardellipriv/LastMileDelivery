apiVersion: apps/v1
kind: Deployment
metadata:
  name: frontend
  labels: { app: frontend }
spec:
  replicas: 2
  selector: { matchLabels: { app: frontend } }
  template:
    metadata: { labels: { app: frontend } }
    spec:
      containers:
        - name: frontend
          # app Flutter compilata per il web, servita da nginx (flutter_app/Dockerfile).
          # Nessuna configurazione: l'app chiama l'API sullo stesso host, che l'Ingress
          # manda ai due microservizi (/api)
          image: localhost:32000/lastmile/frontend:1.6.0
          ports: [{ containerPort: 8080 }]
          readinessProbe:
            httpGet: { path: /health, port: 8080 }
            initialDelaySeconds: 2
            periodSeconds: 5
          livenessProbe:
            httpGet: { path: /health, port: 8080 }
            initialDelaySeconds: 5
            periodSeconds: 10
