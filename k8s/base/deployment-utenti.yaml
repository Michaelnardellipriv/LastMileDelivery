# Microservizio utenti: login (emette i token), utenti, clienti, sedi, indirizzi.
# Usa SOLO il database globale; per le spedizioni chiede al servizio spedizioni (/interno).
apiVersion: apps/v1
kind: Deployment
metadata:
  name: utenti
  labels: { app: utenti }
spec:
  # 2 repliche: le chiavi di idempotenza stanno nel database e JWT_SEGRETO è lo stesso
  # per tutte, quindi una richiesta può arrivare a qualunque replica
  replicas: 2
  selector: { matchLabels: { app: utenti } }
  template:
    metadata: { labels: { app: utenti } }
    spec:
      # parte quando il suo database accetta connessioni (l'immagine del db ha pg_isready)
      initContainers:
        - name: aspetta-db
          image: localhost:32000/lastmile/db-globale:2.4.0
          command: ["sh", "-c", "until pg_isready -h db-globale-svc -p 5432; do echo 'database globale non ancora pronto'; sleep 2; done"]
      containers:
        - name: utenti
          image: localhost:32000/lastmile/utenti:2.5.0
          ports: [{ containerPort: 8080 }]
          envFrom:
            - configMapRef: { name: backend-config }       # URL_SERVIZIO_SPEDIZIONI, LISTEN_ADDR...
            - secretRef: { name: backend-comune-secret }   # JWT_SEGRETO, CHIAVE_INTERNA (uguali per i due servizi)
            - secretRef: { name: utenti-secret }           # DATABASE_URL del database globale
          # /ready: il database risponde; finché no, il Pod non riceve traffico
          readinessProbe:
            httpGet: { path: /ready, port: 8080 }
            initialDelaySeconds: 3
            periodSeconds: 5
          # /health: il processo risponde; se si blocca, Kubernetes lo riavvia
          livenessProbe:
            httpGet: { path: /health, port: 8080 }
            initialDelaySeconds: 10
            periodSeconds: 10
          resources:
            requests: { cpu: 50m, memory: 32Mi }
            limits: { memory: 128Mi }
