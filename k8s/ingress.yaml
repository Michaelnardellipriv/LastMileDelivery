apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: lastmile-ingress
spec:
  rules:
    - host: lastmile.test
      http:
        paths:
          - path: /api
            pathType: Prefix
            backend:
              service:
                name: backend-svc
                port: { number: 8080 }
