apiVersion: apps/v1
kind: Deployment
metadata:
  name: backend
  labels: { app: backend }
spec:
  replicas: 2
  selector: { matchLabels: { app: backend } }
  template:
    metadata: { labels: { app: backend } }
    spec:
      containers:
        - name: backend
          image: localhost:32000/lastmile/backend:1.0.0
          ports: [{ containerPort: 8080 }]
          envFrom:
            - configMapRef: { name: backend-config }
            - secretRef: { name: db-secret }
          readinessProbe:
            tcpSocket: { port: 8080 }
            initialDelaySeconds: 3
            periodSeconds: 5
