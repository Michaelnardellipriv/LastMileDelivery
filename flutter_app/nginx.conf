# nginx del frontend: serve l'app Flutter compilata sulla porta 8080 (utente non root).
server {
    listen 8080;
    server_name _;
    root /usr/share/nginx/html;

    # index.html e il service worker non vanno in cache: dopo un aggiornamento
    # dell'immagine il browser carica subito la nuova versione
    location = /index.html {
        add_header Cache-Control "no-store";
    }
    location = /flutter_service_worker.js {
        add_header Cache-Control "no-store";
    }

    # controllo usato da Kubernetes (readiness e liveness)
    location = /health {
        access_log off;
        default_type application/json;
        return 200 '{"stato":"ok"}';
    }

    # percorsi dell'app: se non è un file, risponde index.html
    location / {
        try_files $uri $uri/ /index.html;
    }
}
