openapi: 3.0.3

info:
  title: LastMileDelivery API
  version: "0.24.0"
  description: |
    API per la gestione delle spedizioni di Veloce24.

    Se il contratto e il codice divergono, il contratto ha vinto: va aggiornato
    nello stesso commit del codice.

    **Autenticazione.** Si fa il login con `POST /api/auth/login` (email e password) e si
    manda il token ricevuto in ogni richiesta: `Authorization: Bearer <token>`. Il token
    contiene ruolo e id dell'utente e scade dopo `DURATA_TOKEN` (predefinito 8 ore).
    Negli schemi di sicurezza qui sotto `operatore`, `corriere`, `cliente`, `amministratore`
    indicano il ruolo richiesto: il token deve essere di un utente con quel ruolo.

    Solo per lo sviluppo, finché `IDENTITA_HEADER_SVILUPPO` vale `attiva` (predefinito), al
    posto del token si accetta ancora uno solo degli header `X-Id-Operatore`, `X-Id-Corriere`,
    `X-Id-Cliente`, `X-Id-Amministratore` (id nella tabella del ruolo). In produzione va
    impostata a `disattiva`.
    Clienti e amministratori possono solo leggere: il cliente l'elenco e il dettaglio
    delle sue spedizioni, l'amministratore tutte le spedizioni e il loro storico.
    L'amministratore non crea, modifica né elimina spedizioni, note o storico: tutte le
    altre operazioni rispondono 403, e non esistono endpoint di eliminazione.

    **Configurazione del server** (variabili d'ambiente): `DATABASE_URL` (obbligatoria),
    `CORS_ORIGIN` (obbligatoria: origini del frontend web ammesse dal browser, separate da
    virgola, senza percorso né barra finale, es. `http://localhost:5173`; `*` = tutte, solo
    sviluppo; le richieste senza `Origin`, come quelle delle app mobile, non ne dipendono),
    `LISTEN_ADDR` (predefinito `127.0.0.1:8080`), `MAX_TENTATIVI` (predefinito 3),
    `GIORNI_VISIBILITA_CLIENTE` (predefinito 30), `JWT_SEGRETO` (almeno 32 caratteri; se
    manca se ne genera uno casuale a ogni avvio), `DURATA_TOKEN` (predefinito `8h`),
    `IDENTITA_HEADER_SVILUPPO` (`attiva` o `disattiva`), `LINK_RECUPERO_PASSWORD` (pagina a
    cui punta il link della mail), `SMTP_HOST`, `SMTP_PORT` (predefinito 587),
    `SMTP_UTENTE`, `SMTP_PASSWORD`, `SMTP_MITTENTE`. Senza `SMTP_HOST` le mail non vengono
    inviate ma scritte nel log del server.

    **Ciclo di vita** (stati del tipo `stato_spedizione` del database):

    | Da | A | Chi | Endpoint |
    | :-- | :-- | :-- | :-- |
    | creata | assegnata | operatore | `POST /assegnazioni` |
    | assegnata, ritirata (questa solo dopo almeno un tentativo di consegna fallito) | stesso stato, altro corriere | operatore | `POST /assegnazioni` |
    | assegnata | assegnata (ritiro fallito) | corriere assegnato | `POST /tentativi` con `tipo: ritiro` |
    | assegnata | ritirata | corriere assegnato | `PATCH /stato` |
    | creata, assegnata | annullata (`motivo` e `nota` obbligatori, facoltativi dopo 3 ritiri falliti) | operatore | `PATCH /stato` |
    | ritirata | in consegna | corriere assegnato | `PATCH /stato` |
    | in consegna | consegnata | corriere assegnato | `PATCH /stato` |
    | in consegna | in consegna (consegna fallita, tentativi 1 e 2) | corriere assegnato | `POST /tentativi` con `tipo: consegna` |
    | in consegna | non consegnata (consegna fallita, 3° tentativo) | corriere assegnato | `POST /tentativi` con `tipo: consegna` |
    | in consegna | ritirata | solo operatore | `PATCH /stato` |
    | ritirata, in consegna | persa (`motivo` e `nota` obbligatori) | operatore | `PATCH /stato` |

    Tentativi (`MAX_TENTATIVI`, predefinito 3):
    - ritiro: la spedizione resta `assegnata`; dopo il terzo il corriere non può più
      registrare tentativi né ritirarla, non si può riassegnare e la annulla l'operatore,
      senza dover ripetere `motivo` e `nota` (ci sono già quelli dei 3 tentativi);
    - consegna: ogni uscita in consegna ammette un solo tentativo. Ai tentativi 1 e 2 la
      spedizione resta `in consegna`; per riprovare l'operatore la riporta in `ritirata`
      (ed eventualmente la riassegna) e il corriere la rimette `in consegna`. Al terzo
      passa da sola a `non consegnata`.

    Ogni tentativo (ritiro e consegna) richiede `motivo` e `nota`, e così i cambi di stato
    in `annullata` e `persa`. La `nota` è testo libero; il `motivo` è un valore dell'elenco
    unico `Motivo` (lo stesso di `GET /api/motivi`), non filtrato per stato o tipo di tentativo.

    Metodi: `POST` per gli endpoint che creano qualcosa (spedizione, assegnazione,
    tentativo, nota), `PATCH` per quelli che modificano la spedizione (dati e stato).

    **Note.** Tutte le note stanno nella stessa tabella:
    - note pubbliche (`is_interna: false`): nascono solo con ogni tentativo di ritiro o
      di consegna (`POST /tentativi`) e con i cambi di stato in `annullata` o `persa`
      (`PATCH /stato`). Sono composte da un `motivo` pubblico e da una `nota` interna: al
      cliente arriva solo il `motivo`;
    - note interne (`is_interna: true`): si creano solo con `POST /api/spedizioni/{id}/note`.
      Gli altri cambi di stato non accettano la `nota`.

    Il cliente non vede mai le note interne né il testo o l'autore delle note pubbliche.

    I dati si modificano con `PATCH /api/spedizioni/{id}` solo finché la spedizione non
    è ritirata. Stati finali: consegnata, non consegnata, persa, annullata.

    `is_reso` lo imposta l'operatore con `PATCH /api/spedizioni/{id}`, solo quando la
    spedizione è `annullata`, `persa` o `non consegnata`. Alla creazione vale sempre `false`.

    Ogni cambio della spedizione è registrato nello storico (`cambiamenti_spedizioni`) con
    autore, data, valore precedente e nuovo. Ogni tentativo fallito è salvato in
    `tentativi` con la sua nota, che riporta il corriere che l'ha scritta.

servers:
  - url: http://localhost:8080
    description: Server locale di sviluppo

tags:
  - name: autenticazione
    description: Login, cambio e recupero della password
  - name: spedizioni
  - name: posizioni
    description: Posizione simulata dei corrieri (RF16) e intervallo di invio
  - name: anagrafiche
    description: |
      Clienti e indirizzi, per creare una spedizione dall'interfaccia: l'operatore cerca o
      crea mittente e destinatario (`/api/clienti`) e gli indirizzi di ritiro e consegna
      (`/api/indirizzi`), poi crea la spedizione con gli id ottenuti (`POST /api/spedizioni`).

paths:
  /api/auth/login:
    post:
      tags: [autenticazione]
      summary: Login con email e password
      description: |
        Restituisce il token da mandare in `Authorization: Bearer <token>`. L'email non
        distingue maiuscole e minuscole. Password sbagliata ed email sconosciuta danno lo
        stesso 401, per non rivelare quali email esistono. Ogni utente ha una password fin
        dalla creazione (obbligatoria nel database); al cliente destinatario la comunica
        l'operatore per mail.
        Se l'utente ha più ruoli (per esempio corriere e cliente) va indicato `ruolo`.
      operationId: login
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/Login' }
            example: { email: destinatario@veloce24.test, password: LaMiaPassword1 }
      responses:
        '200':
          description: Login riuscito
          headers:
            Cache-Control:
              schema: { type: string, example: no-store }
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Sessione' }
              example:
                token: eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJzdWIiOiI0IiwicnVvbG8iOiJjbGllbnRlIiwiaWQiOjIsImlhdCI6MCwiZXhwIjowfQ.firma
                tipo: Bearer
                scade_il: '2026-11-09T18:00:00Z'
                utente: { id_utente: 4, ruolo: cliente, id: 2, nome: Dora, cognome: Destinataria, email: destinatario@veloce24.test }
        '400':
          description: '`email` o `password` mancanti; utente con più ruoli senza `ruolo`'
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Errore' }
        '401':
          description: Email o password non corrette
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Errore' }
              example: { errore: email o password non corrette }
        '403':
          description: '`ruolo` indicato che l''utente non ha'
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Errore' }
        '415': { $ref: '#/components/responses/NonJSON' }
        '500': { $ref: '#/components/responses/ErroreInterno' }
        '503': { $ref: '#/components/responses/NonDisponibile' }

  /api/auth/cambio-password:
    post:
      tags: [autenticazione]
      summary: Cambio della propria password
      description: Per l'utente già autenticato. Serve la password attuale.
      operationId: cambiaPassword
      security:
        - operatore: []
        - corriere: []
        - cliente: []
        - amministratore: []
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/CambioPassword' }
            example: { password_attuale: LaMiaPassword1, nuova_password: LaNuovaPassword2 }
      responses:
        '204': { description: Password cambiata }
        '400':
          description: Campi mancanti; nuova password sotto gli 8 caratteri, oltre i 72 byte o uguale all'attuale
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Errore' }
        '401': { $ref: '#/components/responses/NonIdentificato' }
        '403':
          description: Password attuale non corretta
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Errore' }
        '415': { $ref: '#/components/responses/NonJSON' }
        '500': { $ref: '#/components/responses/ErroreInterno' }
        '503': { $ref: '#/components/responses/NonDisponibile' }

  /api/auth/recupero-password:
    post:
      tags: [autenticazione]
      summary: Richiesta di recupero della password via mail
      description: |
        Per chi ha dimenticato la password: se l'email è registrata, invia una mail con un
        link valido 30 minuti per sceglierne una nuova. La risposta è sempre
        202, anche per email sconosciute, per non rivelare quali email esistono. Una nuova
        richiesta annulla i link precedenti; oltre 3 richieste nell'ultima ora per lo stesso
        utente la mail non viene inviata. Il link è `LINK_RECUPERO_PASSWORD?token=<token>`.
      operationId: richiediRecuperoPassword
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/RecuperoPassword' }
            example: { email: destinatario@veloce24.test }
      responses:
        '202':
          description: Richiesta presa in carico
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Messaggio' }
        '400':
          description: '`email` mancante'
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Errore' }
        '415': { $ref: '#/components/responses/NonJSON' }
        '500': { $ref: '#/components/responses/ErroreInterno' }
        '503': { $ref: '#/components/responses/NonDisponibile' }

  /api/auth/reimposta-password:
    post:
      tags: [autenticazione]
      summary: Nuova password con il token ricevuto per mail
      description: Il token vale una sola volta e per 30 minuti.
      operationId: reimpostaPassword
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/ReimpostaPassword' }
            example: { token: NNwZnQuouqNT2e5W0BxoqrNfne0D8KZ_SJoLqnoKkPM, nuova_password: LaNuovaPassword2 }
      responses:
        '204': { description: Password impostata }
        '400':
          description: Token mancante, non valido, scaduto o già usato; nuova password non valida
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Errore' }
        '415': { $ref: '#/components/responses/NonJSON' }
        '500': { $ref: '#/components/responses/ErroreInterno' }
        '503': { $ref: '#/components/responses/NonDisponibile' }

  /api/spedizioni:
    get:
      tags: [spedizioni]
      summary: Elenca le spedizioni visibili a chi chiama
      description: |
        Il contenuto dipende dal ruolo:

        | Ruolo | Spedizioni restituite | Note | `id_corriere` |
        | :-- | :-- | :-- | :-- |
        | operatore, amministratore | tutte, in tutti gli stati | tutte | sì |
        | corriere | solo quelle assegnate a lui, finché non sono concluse (`assegnata`, `ritirata`, `in consegna`) | tutte | no |
        | cliente | solo quelle di cui è destinatario: quelle in corso sempre, quelle chiuse (consegnata, non consegnata, persa, annullata) fino a `GIORNI_VISIBILITA_CLIENTE` giorni dalla chiusura (predefinito 30) | solo il `motivo` (e la data) delle note pubbliche | no |

        La data di chiusura (`conclusa_il`) è quella in cui la spedizione è entrata nello
        stato finale, presa dallo storico.

        Ordinate dalla più recente. I filtri si applicano dentro ciò che il ruolo può già
        vedere (un corriere che chiede `stato=consegnata` riceve una lista vuota) e si
        possono combinare.
      operationId: elencaSpedizioni
      security:
        - operatore: []
        - corriere: []
        - cliente: []
        - amministratore: []
      parameters:
        - name: stato
          in: query
          required: false
          schema: { $ref: '#/components/schemas/Stato' }
        - name: id_corriere
          in: query
          required: false
          description: Solo le spedizioni assegnate a questo corriere. Solo per operatore e amministratore (altrimenti 403).
          schema: { type: integer, format: int32, minimum: 1 }
        - name: dal
          in: query
          required: false
          description: Data di creazione minima, inclusa (AAAA-MM-GG, ora italiana)
          schema: { type: string, format: date, example: '2026-11-01' }
        - name: al
          in: query
          required: false
          description: Data di creazione massima, inclusa (AAAA-MM-GG, ora italiana); non prima di `dal`
          schema: { type: string, format: date, example: '2026-11-30' }
        - name: cod_ordine
          in: query
          required: false
          description: Riferimento della spedizione; trova i codici che lo contengono, senza distinguere maiuscole e minuscole
          schema: { type: string, minLength: 1, maxLength: 50, example: ORD-2026 }
        - name: pagina
          in: query
          required: false
          description: Numero di pagina, da 1
          schema: { type: integer, minimum: 1, default: 1 }
        - name: per_pagina
          in: query
          required: false
          description: Elementi per pagina
          schema: { type: integer, minimum: 1, maximum: 100, default: 20 }
      responses:
        '200':
          description: Elenco (può essere vuoto)
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ListaSpedizioni' }
              example:
                dati:
                  - id: 2
                    cod_ordine: ORD-2
                    stato: ritirata
                    is_reso: false
                    creata_il: '2026-10-27T21:00:00Z'
                    dataora_richiesta_spedizione: '2026-10-28T09:00:00Z'
                    id_cliente_mittente: 1
                    id_cliente_destinatario: 2
                    indirizzo_ritiro: { via: Via Roma, civico: '1' }
                    indirizzo_spedizione: { via: Via Verdi, civico: '10' }
                    id_corriere: 1
                    conclusa_il: null
                    note:
                      - { id: 1, nota: Il mittente ha annullato l'ordine, is_interna: false, motivo: richiesta del mittente, creata_il: '2026-10-27T21:01:00Z' }
                pagina: 1
                per_pagina: 20
        '400':
          description: Parametro non valido (`stato`, `id_corriere`, `dal`, `al`, `cod_ordine`, `pagina` o `per_pagina`)
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Errore' }
        '401': { $ref: '#/components/responses/NonIdentificato' }
        '403':
          description: Filtro `id_corriere` usato da un corriere o da un cliente
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Errore' }
        '500': { $ref: '#/components/responses/ErroreInterno' }
        '503': { $ref: '#/components/responses/NonDisponibile' }

    post:
      tags: [spedizioni]
      summary: Crea una spedizione
      description: |
        L'operatore logistico crea una spedizione con clienti e indirizzi già esistenti
        (cercati o creati con `/api/clienti` e `/api/indirizzi`). Senza `id_corriere` nasce
        `creata`; con `id_corriere` (scelto da `GET /api/corrieri`) nasce già `assegnata` a quel
        corriere, nella stessa operazione, e lo storico registra creazione e assegnazione.
        `cod_ordine` è il riferimento esterno (es. l'ordine dell'e-commerce) ed è unico.
      operationId: creaSpedizione
      security:
        - operatore: []
      parameters:
        - $ref: '#/components/parameters/IdempotencyKey'
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/NuovaSpedizione' }
            example:
              cod_ordine: ORD-2026-0001
              id_cliente_mittente: 1
              id_cliente_destinatario: 2
              dataora_richiesta_spedizione: '2026-11-02T09:00:00+01:00'
              id_indirizzo_ritiro: 1
              id_indirizzo_spedizione: 2
      responses:
        '201': { $ref: '#/components/responses/SpedizioneCreata' }
        '400':
          description: |
            Dati non validi: JSON malformato, campo mancante o non previsto, tipo errato,
            data non ISO 8601, `ritirata_il` inviata dal client (la decide il
            sistema), cliente o indirizzo inesistente, indirizzi uguali.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Errore' }
              example:
                errore: dati non validi
                dettagli:
                  - { campo: id_cliente_destinatario, messaggio: obbligatorio }
                  - { campo: cod_ordine, messaggio: 'solo lettere, cifre e . _ / - senza spazi' }
        '401': { $ref: '#/components/responses/NonIdentificato' }
        '403': { $ref: '#/components/responses/NonAutorizzato' }
        '409':
          description: Codice ordine già usato, oppure Idempotency-Key già usata con dati diversi
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Errore' }
        '415': { $ref: '#/components/responses/NonJSON' }
        '500': { $ref: '#/components/responses/ErroreInterno' }
        '503': { $ref: '#/components/responses/NonDisponibile' }

  /api/spedizioni/{id}:
    parameters:
      - $ref: '#/components/parameters/IdSpedizione'
    get:
      tags: [spedizioni]
      summary: Dettaglio di una spedizione
      description: |
        Una spedizione con indirizzi, corriere, tentativi falliti, date e note.
        Le regole di visibilità sono quelle dell'elenco:

        | Chi | Vede |
        | :-- | :-- |
        | operatore, amministratore | qualsiasi spedizione, con corriere, note interne e autori delle note |
        | corriere | solo le spedizioni assegnate a lui in `assegnata`, `ritirata`, `in consegna`, con note interne |
        | cliente | solo quelle di cui è destinatario, fino a `GIORNI_VISIBILITA_CLIENTE` giorni dalla chiusura; senza corriere; delle note vede solo il `motivo` di quelle pubbliche (tentativi, annullata, persa) |

        Una spedizione che il richiedente non può vedere risponde 404, come se non esistesse.
      operationId: dettaglioSpedizione
      security:
        - operatore: []
        - corriere: []
        - cliente: []
        - amministratore: []
      responses:
        '200':
          description: Dettaglio della spedizione
          content:
            application/json:
              schema: { $ref: '#/components/schemas/DettaglioSpedizione' }
              example:
                id: 42
                cod_ordine: ORD-2026-0001
                stato: ritirata
                is_reso: false
                creata_il: '2026-11-01T09:00:00Z'
                dataora_richiesta_spedizione: '2026-11-02T09:00:00Z'
                id_cliente_mittente: 3
                id_cliente_destinatario: 5
                indirizzo_ritiro: { via: Via Roma, civico: '10' }
                indirizzo_spedizione: { via: Corso Italia, civico: 5B }
                id_corriere: 1
                conclusa_il: null
                annullata_il: null
                tentativi_ritiro_falliti: 1
                tentativi_consegna_falliti: 0
                note:
                  - id: 7
                    nota: Magazzino del mittente chiuso
                    is_interna: true
                    motivo: mittente assente
                    creata_il: '2026-11-01T10:00:00Z'
                    autore: { ruolo: corriere, id: 1 }
        '400':
          description: Id non valido
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Errore' }
        '401': { $ref: '#/components/responses/NonIdentificato' }
        '404': { $ref: '#/components/responses/NonTrovata' }
        '500': { $ref: '#/components/responses/ErroreInterno' }
        '503': { $ref: '#/components/responses/NonDisponibile' }

    patch:
      tags: [spedizioni]
      summary: Modifica i dati di una spedizione
      description: |
        L'operatore modifica la spedizione mandando solo i campi da cambiare.
        - `is_reso`: solo se la spedizione è `annullata`, `persa` o `non consegnata`;
        - tutti gli altri campi: solo finché non è ritirata (stati `creata` e `assegnata`).

        `cod_ordine`, lo stato e il corriere non si cambiano qui. Inviare gli stessi
        valori non scrive nello storico.
      operationId: modificaSpedizione
      security:
        - operatore: []
      parameters:
        - $ref: '#/components/parameters/IdempotencyKey'
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/ModificaSpedizione' }
            examples:
              dati:
                summary: Cambia indirizzo e data richiesta (spedizione creata o assegnata)
                value:
                  id_indirizzo_spedizione: 3
                  dataora_richiesta_spedizione: '2026-11-03T14:00:00+01:00'
              reso:
                summary: Segna come reso (spedizione annullata, persa o non consegnata)
                value:
                  is_reso: true
      responses:
        '200': { $ref: '#/components/responses/SpedizioneAggiornata' }
        '400':
          description: |
            Dati non validi: nessun campo, campo non previsto, data non ISO 8601, `ritirata_il`
            (la decide il sistema), riferimento inesistente, indirizzo di spedizione uguale a
            quello di ritiro.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Errore' }
        '401': { $ref: '#/components/responses/NonIdentificato' }
        '403': { $ref: '#/components/responses/NonAutorizzato' }
        '404': { $ref: '#/components/responses/NonTrovata' }
        '409':
          description: |
            Campi non modificabili nello stato attuale: dati dopo il ritiro, oppure
            `is_reso` su una spedizione non annullata, persa o non consegnata
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Errore' }
        '415': { $ref: '#/components/responses/NonJSON' }
        '500': { $ref: '#/components/responses/ErroreInterno' }
        '503': { $ref: '#/components/responses/NonDisponibile' }

  /api/spedizioni/{id}/assegnazioni:
    parameters:
      - $ref: '#/components/parameters/IdSpedizione'
    post:
      tags: [spedizioni]
      summary: Assegna o riassegna la spedizione a un corriere
      description: |
        L'operatore crea una nuova assegnazione, che diventa quella corrente.
        - `creata`: la spedizione passa ad `assegnata`;
        - `assegnata` o `ritirata`: lo stato non cambia, cambia solo il corriere. Una
          spedizione `ritirata` si riassegna solo se ha avuto almeno un tentativo di
          consegna fallito (l'operatore l'ha riportata in `ritirata` per riprovare).

        Rispondere 201 vuol dire che è stata creata un'assegnazione; se il corriere è già
        quello assegnato non succede niente e risponde 200. In entrambi i casi il corpo è
        la spedizione aggiornata.
      operationId: assegnaSpedizione
      security:
        - operatore: []
      parameters:
        - $ref: '#/components/parameters/IdempotencyKey'
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/Assegnazione' }
            example: { id_corriere: 1 }
      responses:
        '200': { $ref: '#/components/responses/SpedizioneAggiornata' }
        '201': { $ref: '#/components/responses/SpedizioneCreata' }
        '400':
          description: '`id_corriere` mancante, non valido o inesistente'
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Errore' }
        '401': { $ref: '#/components/responses/NonIdentificato' }
        '403': { $ref: '#/components/responses/NonAutorizzato' }
        '404': { $ref: '#/components/responses/NonTrovata' }
        '409':
          description: Spedizione in consegna o chiusa, tentativi di ritiro esauriti, oppure spedizione ritirata senza tentativi di consegna falliti
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Errore' }
        '415': { $ref: '#/components/responses/NonJSON' }
        '500': { $ref: '#/components/responses/ErroreInterno' }
        '503': { $ref: '#/components/responses/NonDisponibile' }

  /api/spedizioni/{id}/tentativi:
    parameters:
      - $ref: '#/components/parameters/IdSpedizione'
    post:
      tags: [spedizioni]
      summary: Registra un tentativo di ritiro o di consegna non riuscito
      description: |
        Il corriere assegnato registra un tentativo fallito; lo stato lo decide il server.
        - `ritiro` (spedizione `assegnata`): resta `assegnata`; al massimo 3 tentativi;
        - `consegna` (spedizione `in consegna`): un solo tentativo per uscita; resta
          `in consegna` ai tentativi 1 e 2, passa a `non consegnata` al terzo.

        `motivo` e `nota` sono sempre obbligatori e formano una nota pubblica: il cliente
        vede solo il `motivo`, la `nota` resta interna.

        Ogni richiesta registra un nuovo tentativo: per ripeterla senza danni usare
        `Idempotency-Key`. Il corpo della risposta è la spedizione aggiornata.
      operationId: registraTentativo
      security:
        - corriere: []
      parameters:
        - $ref: '#/components/parameters/IdempotencyKey'
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/TentativoFallito' }
            examples:
              ritiro:
                summary: Ritiro non riuscito
                value: { tipo: ritiro, motivo: mittente assente, nota: Magazzino del mittente chiuso }
              consegna:
                summary: Consegna non riuscita
                value: { tipo: consegna, motivo: destinatario assente, nota: Citofono rotto, nessuno risponde }
              ultimaConsegna:
                summary: Terzo tentativo di consegna (la spedizione diventa non consegnata)
                value: { tipo: consegna, motivo: destinatario assente, nota: Terzo passaggio, nessuno in casa }
      responses:
        '201': { $ref: '#/components/responses/SpedizioneCreata' }
        '400':
          description: '`tipo` mancante o sconosciuto, `nota` mancante o vuota, `motivo` mancante o fuori elenco'
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Errore' }
              example:
                errore: dati non validi
                dettagli:
                  - { campo: nota, messaggio: obbligatoria per ogni tentativo non riuscito }
        '401': { $ref: '#/components/responses/NonIdentificato' }
        '403': { $ref: '#/components/responses/NonAutorizzato' }
        '404': { $ref: '#/components/responses/NonTrovata' }
        '409':
          description: Spedizione nello stato sbagliato per quel tipo di tentativo, tentativi di ritiro esauriti, oppure tentativo di consegna già registrato in questa uscita (va prima riportata in ritirata dall'operatore)
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Errore' }
        '415': { $ref: '#/components/responses/NonJSON' }
        '500': { $ref: '#/components/responses/ErroreInterno' }
        '503': { $ref: '#/components/responses/NonDisponibile' }

  /api/spedizioni/{id}/note:
    parameters:
      - $ref: '#/components/parameters/IdSpedizione'
    post:
      tags: [spedizioni]
      summary: Aggiunge una nota operativa libera
      description: |
        Operatori e corrieri scrivono una nota interna sulla spedizione, in qualsiasi
        momento, senza cambiarne lo stato e senza righe nello storico. Le note libere
        sono sempre interne: le note pubbliche nascono solo con i tentativi e con i cambi
        di stato in annullata o persa.
        - operatore: su qualsiasi spedizione, in qualsiasi stato;
        - corriere: solo sulle spedizioni assegnate a lui in `ritirata` o `in consegna`
          (403 se non è sua, 409 negli altri stati, compresa `consegnata`).

        Ogni richiesta aggiunge una nota: per ripeterla senza duplicati usare
        `Idempotency-Key`.
      operationId: aggiungiNota
      security:
        - operatore: []
        - corriere: []
      parameters:
        - $ref: '#/components/parameters/IdempotencyKey'
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/NuovaNota' }
            examples:
              interna:
                summary: Nota interna
                value: { nota: Pacco fragile, maneggiare con cura }
      responses:
        '201':
          description: Nota salvata
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Nota' }
              example:
                id: 8
                nota: Pacco fragile, maneggiare con cura
                is_interna: true
                motivo: null
                creata_il: '2026-11-01T11:00:00Z'
                autore: { ruolo: operatore, id: 1 }
        '400':
          description: '`nota` mancante, vuota o oltre 2000 caratteri; campi diversi da `nota` (per esempio `is_interna`); id non valido'
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Errore' }
              example:
                errore: dati non validi
                dettagli:
                  - { campo: nota, messaggio: obbligatoria }
        '401': { $ref: '#/components/responses/NonIdentificato' }
        '403': { $ref: '#/components/responses/NonAutorizzato' }
        '404': { $ref: '#/components/responses/NonTrovata' }
        '409':
          description: Il corriere scrive su una spedizione che non è ritirata o in consegna
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Errore' }
        '415': { $ref: '#/components/responses/NonJSON' }
        '500': { $ref: '#/components/responses/ErroreInterno' }
        '503': { $ref: '#/components/responses/NonDisponibile' }

  /api/spedizioni/{id}/stato:
    parameters:
      - $ref: '#/components/parameters/IdSpedizione'
    patch:
      tags: [spedizioni]
      summary: Cambia lo stato di una spedizione
      description: |
        Solo i cambi di stato veri e propri:
        - corriere assegnato: `ritirata` (da assegnata), `in consegna`, `consegnata`;
        - operatore: `ritirata` (da in consegna, per riportarla indietro), `annullata`, `persa`.

        `annullata` e `persa` richiedono `motivo` (pubblico) e `nota` (interna). Fa eccezione
        l'annullamento dopo 3 ritiri falliti: `motivo` e `nota` sono facoltativi, ma se si
        indicano vanno indicati entrambi. Gli altri
        stati non accettano né `motivo` né `nota`: le note interne si scrivono con
        `POST /api/spedizioni/{id}/note`. `assegnata` si
        ottiene con `/assegnazioni`, `non consegnata` con `/tentativi`, `creata` mai.

        Chiedere di nuovo lo stato in cui la spedizione è già non cambia niente, non scrive
        nello storico e risponde 200.
      operationId: cambiaStatoSpedizione
      security:
        - operatore: []
        - corriere: []
      parameters:
        - $ref: '#/components/parameters/IdempotencyKey'
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/CambioStato' }
            examples:
              ritiro:
                summary: Il corriere ha ritirato il pacco
                value: { stato: ritirata }
              annullamento:
                summary: L'operatore annulla
                value: { stato: annullata, motivo: richiesta del mittente, nota: Il negozio ha chiamato alle 10 }
              persa:
                summary: L'operatore registra lo smarrimento
                value: { stato: persa, motivo: smarrita durante il trasporto, nota: Il corriere segnala che il pacco non è nel furgone }
              riportaInRitirata:
                summary: L'operatore riporta in ritirata dopo una consegna fallita
                value: { stato: ritirata }
      responses:
        '200': { $ref: '#/components/responses/SpedizioneAggiornata' }
        '400':
          description: Stato mancante, sconosciuto o che si imposta con un altro endpoint; `motivo` o `nota` mancanti per `annullata` o `persa` (dopo 3 ritiri falliti, uno solo dei due); `motivo` fuori elenco; `motivo` o `nota` presenti con altri stati
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Errore' }
        '401': { $ref: '#/components/responses/NonIdentificato' }
        '403': { $ref: '#/components/responses/NonAutorizzato' }
        '404': { $ref: '#/components/responses/NonTrovata' }
        '409':
          description: Transizione non ammessa dallo stato attuale, spedizione chiusa o tentativi di ritiro esauriti
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Errore' }
              example: { errore: 'da "assegnata" non si può passare a "consegnata"' }
        '415': { $ref: '#/components/responses/NonJSON' }
        '500': { $ref: '#/components/responses/ErroreInterno' }
        '503': { $ref: '#/components/responses/NonDisponibile' }

  /api/spedizioni/{id}/storico:
    parameters:
      - $ref: '#/components/parameters/IdSpedizione'
    get:
      tags: [spedizioni]
      summary: Storico delle modifiche di una spedizione
      description: |
        Tutte le righe di `cambiamenti_spedizioni` della spedizione, dalla più vecchia:
        creazione, modifiche (dati, assegnazioni, cambi di stato, reso) e annullamento,
        con autore, data e valori prima e dopo. Visibile ad amministratori e operatori
        logistici.
      operationId: storicoSpedizione
      security:
        - amministratore: []
        - operatore: []
      responses:
        '200':
          description: Storico della spedizione
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Storico' }
              example:
                dati:
                  - id: 1
                    operazione: creazione
                    valore_vecchio: null
                    valore_nuovo: { id: 42, stato: creata, cod_ordine: ORD-2026-0001 }
                    modificato_il: '2026-11-01T09:00:00Z'
                    autore: { ruolo: operatore, id: 1, nome: Oscar, cognome: Operatore }
                  - id: 2
                    operazione: modifica
                    valore_vecchio: { stato: assegnata }
                    valore_nuovo: { stato: ritirata }
                    modificato_il: '2026-11-01T10:30:00Z'
                    autore: { ruolo: corriere, id: 1, nome: Carlo, cognome: Corriere }
        '400':
          description: Id non valido
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Errore' }
        '401': { $ref: '#/components/responses/NonIdentificato' }
        '403': { $ref: '#/components/responses/NonAutorizzato' }
        '404': { $ref: '#/components/responses/NonTrovata' }
        '500': { $ref: '#/components/responses/ErroreInterno' }
        '503': { $ref: '#/components/responses/NonDisponibile' }

  /api/motivi:
    get:
      tags: [spedizioni]
      summary: Motivi pubblici ammessi
      description: |
        Elenco unico dei motivi che il cliente vede: i client lo mostrano in un menu a tendina.
        Sono gli unici valori accettati nel campo `motivo` di `POST /api/spedizioni/{id}/tentativi`
        e `PATCH /api/spedizioni/{id}/stato`; l'elenco non dipende dallo stato né dal tipo di
        tentativo.
      operationId: elencoMotivi
      security:
        - operatore: []
        - corriere: []
        - cliente: []
        - amministratore: []
      responses:
        '200':
          description: Elenco dei motivi
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Motivi' }
              example:
                dati: [mittente assente, pacco non pronto, indirizzo di ritiro errato, destinatario assente,
                       indirizzo errato, rifiutata dal destinatario, accesso impossibile, richiesta del mittente,
                       richiesta del destinatario, dati della spedizione errati, ritiro non riuscito,
                       smarrita in deposito, smarrita durante il trasporto, furto, altro]
        '401': { $ref: '#/components/responses/NonIdentificato' }

  /api/clienti:
    get:
      tags: [anagrafiche]
      summary: Ricerca dei clienti
      description: |
        Operatori e amministratori. `q` cerca, senza distinguere maiuscole e minuscole, in
        nome e cognome (in qualsiasi ordine), email e numero di telefono; vuoto = tutti.
        Ordinati per cognome e nome.
      operationId: cercaClienti
      security:
        - operatore: []
        - amministratore: []
      parameters:
        - { name: q, in: query, required: false, schema: { type: string, maxLength: 100 } }
        - { name: pagina, in: query, required: false, schema: { type: integer, minimum: 1, default: 1 } }
        - { name: per_pagina, in: query, required: false, schema: { type: integer, minimum: 1, maximum: 100, default: 20 } }
      responses:
        '200':
          description: Clienti trovati
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ListaClienti' }
        '400':
          description: Parametri non validi
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Errore' }
        '401': { $ref: '#/components/responses/NonIdentificato' }
        '403': { $ref: '#/components/responses/NonAutorizzato' }
        '500': { $ref: '#/components/responses/ErroreInterno' }
        '503': { $ref: '#/components/responses/NonDisponibile' }
    post:
      tags: [anagrafiche]
      summary: Crea un cliente (mittente o destinatario)
      description: |
        Solo l'operatore. Crea l'utente con la `password` indicata dall'operatore (da 8
        caratteri a 72 byte, salvata come hash) e il cliente, poi invia al cliente una mail con
        email e password; `mail_inviata` dice se la mail è partita (il cliente resta creato
        anche se l'invio fallisce).

        Ogni email ha un solo ruolo: se è già usata da un qualsiasi utente (cliente, corriere,
        operatore o amministratore) risponde 409. Un cliente già registrato si cerca con
        `GET /api/clienti`. L'email non distingue maiuscole e minuscole.
      operationId: creaCliente
      security:
        - operatore: []
      parameters:
        - $ref: '#/components/parameters/IdempotencyKey'
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/NuovoCliente' }
            example: { nome: Giulia, cognome: Rossi, prefisso: '+39', nr_telefono: '3331234567', email: giulia.rossi@example.com, password: PasswordIniziale1 }
      responses:
        '201':
          description: Cliente creato
          content:
            application/json:
              schema: { $ref: '#/components/schemas/EsitoCliente' }
        '400':
          description: Campi mancanti o non validi, password compresa
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Errore' }
        '401': { $ref: '#/components/responses/NonIdentificato' }
        '403': { $ref: '#/components/responses/NonAutorizzato' }
        '409':
          description: Email già usata da un altro utente (con qualsiasi ruolo), oppure numero di telefono già usato
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Errore' }
        '415': { $ref: '#/components/responses/NonJSON' }
        '500': { $ref: '#/components/responses/ErroreInterno' }
        '503': { $ref: '#/components/responses/NonDisponibile' }

  /api/corrieri:
    get:
      tags: [anagrafiche]
      summary: Elenco dei corrieri
      description: |
        Operatori e amministratori: tutti i corrieri, anche quelli senza spedizioni, per
        scegliere a chi assegnare una spedizione o per il filtro `id_corriere` dell'elenco.
        `q` cerca, senza distinguere maiuscole e minuscole, in nome e cognome, email e
        telefono; vuoto = tutti. Ordinati per cognome e nome.
      operationId: elencaCorrieri
      security:
        - operatore: []
        - amministratore: []
      parameters:
        - { name: q, in: query, required: false, schema: { type: string, maxLength: 100 } }
        - { name: pagina, in: query, required: false, schema: { type: integer, minimum: 1, default: 1 } }
        - { name: per_pagina, in: query, required: false, schema: { type: integer, minimum: 1, maximum: 100, default: 20 } }
      responses:
        '200':
          description: Corrieri trovati
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ListaCorrieri' }
        '400':
          description: Parametri non validi
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Errore' }
        '401': { $ref: '#/components/responses/NonIdentificato' }
        '403': { $ref: '#/components/responses/NonAutorizzato' }
        '500': { $ref: '#/components/responses/ErroreInterno' }
        '503': { $ref: '#/components/responses/NonDisponibile' }

  /api/indirizzi:
    get:
      tags: [anagrafiche]
      summary: Ricerca degli indirizzi
      description: |
        Operatori e amministratori. `q` cerca, senza distinguere maiuscole e minuscole, in via,
        civico, città e CAP; vuoto = tutti.
      operationId: cercaIndirizzi
      security:
        - operatore: []
        - amministratore: []
      parameters:
        - { name: q, in: query, required: false, schema: { type: string, maxLength: 100 } }
        - { name: pagina, in: query, required: false, schema: { type: integer, minimum: 1, default: 1 } }
        - { name: per_pagina, in: query, required: false, schema: { type: integer, minimum: 1, maximum: 100, default: 20 } }
      responses:
        '200':
          description: Indirizzi trovati
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ListaIndirizzi' }
        '400':
          description: Parametri non validi
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Errore' }
        '401': { $ref: '#/components/responses/NonIdentificato' }
        '403': { $ref: '#/components/responses/NonAutorizzato' }
        '500': { $ref: '#/components/responses/ErroreInterno' }
        '503': { $ref: '#/components/responses/NonDisponibile' }
    post:
      tags: [anagrafiche]
      summary: Trova o crea un indirizzo
      description: |
        Solo l'operatore. Tutti i campi sono obbligatori. Nazione, regione e città vengono
        riusate se esistono già (senza distinguere maiuscole e minuscole), altrimenti create.
        Se nella stessa città esiste già un indirizzo con la stessa via e lo stesso civico
        risponde 200 con quello, altrimenti lo crea e risponde 201. In entrambi i casi l'`id`
        si usa come `id_indirizzo_ritiro` o `id_indirizzo_spedizione` della spedizione.
      operationId: trovaOCreaIndirizzo
      security:
        - operatore: []
      parameters:
        - $ref: '#/components/parameters/IdempotencyKey'
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/NuovoIndirizzo' }
            example: { via: Via Dante, civico: '7', citta: Milano, cap: '20121', regione: Lombardia, nazione: Italia }
      responses:
        '200':
          description: Indirizzo già presente
          content:
            application/json:
              schema: { $ref: '#/components/schemas/IndirizzoAnagrafica' }
        '201':
          description: Indirizzo creato
          content:
            application/json:
              schema: { $ref: '#/components/schemas/IndirizzoAnagrafica' }
        '400':
          description: Campi mancanti o troppo lunghi
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Errore' }
        '401': { $ref: '#/components/responses/NonIdentificato' }
        '403': { $ref: '#/components/responses/NonAutorizzato' }
        '415': { $ref: '#/components/responses/NonJSON' }
        '500': { $ref: '#/components/responses/ErroreInterno' }
        '503': { $ref: '#/components/responses/NonDisponibile' }

  /api/corrieri/posizione:
    post:
      tags: [posizioni]
      summary: Il corriere invia la propria posizione (simulata)
      description: |
        Solo corrieri. La posizione viene salvata solo se il corriere ha almeno una
        spedizione `in consegna` e non più spesso dell'intervallo impostato
        dall'amministratore (con 2 secondi di tolleranza). La risposta dice ogni quanti
        secondi inviare la prossima. Il simulatore `go run ./cmd/simulatore-corriere`
        usa questo endpoint.
      operationId: inviaPosizione
      security:
        - corriere: []
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/NuovaPosizione' }
            example: { latitudine: 46.0679, longitudine: 11.1211 }
      responses:
        '201':
          description: Posizione salvata
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Intervallo' }
        '400':
          description: Coordinate mancanti o fuori range
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Errore' }
        '401': { $ref: '#/components/responses/NonIdentificato' }
        '403': { $ref: '#/components/responses/NonAutorizzato' }
        '409':
          description: Il corriere non ha spedizioni in consegna
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Errore' }
        '415': { $ref: '#/components/responses/NonJSON' }
        '429':
          description: Inviata prima che sia passato l'intervallo; `Retry-After` indica i secondi da attendere
          headers:
            Retry-After:
              schema: { type: integer }
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Errore' }
        '500': { $ref: '#/components/responses/ErroreInterno' }
        '503': { $ref: '#/components/responses/NonDisponibile' }

  /api/corrieri/posizioni:
    get:
      tags: [posizioni]
      summary: Ultima posizione dei corrieri con spedizioni in consegna
      description: |
        Solo operatori logistici. Per ogni corriere che ha ora spedizioni `in consegna`
        e ha inviato almeno una posizione: l'ultima posizione e le spedizioni in consegna.
        Chi ha finito le consegne non compare, anche se le sue posizioni restano salvate.
      operationId: elencaPosizioni
      security:
        - operatore: []
      responses:
        '200':
          description: Posizioni dei corrieri attivi
          content:
            application/json:
              schema: { $ref: '#/components/schemas/PosizioniCorrieri' }
              example:
                intervallo_secondi: 30
                corrieri:
                  - id_corriere: 1
                    nome: Carlo
                    cognome: Corriere
                    latitudine: 46.0679
                    longitudine: 11.1211
                    rilevata_il: '2026-11-04T10:00:00Z'
                    spedizioni_attive: [42, 43]
        '401': { $ref: '#/components/responses/NonIdentificato' }
        '403': { $ref: '#/components/responses/NonAutorizzato' }
        '500': { $ref: '#/components/responses/ErroreInterno' }
        '503': { $ref: '#/components/responses/NonDisponibile' }

  /api/impostazioni/intervallo-posizione:
    get:
      tags: [posizioni]
      summary: Ogni quanti secondi il corriere invia la posizione
      description: Corrieri, operatori e amministratori; il cliente riceve 403.
      operationId: leggiIntervalloPosizione
      security:
        - corriere: []
        - operatore: []
        - amministratore: []
      responses:
        '200':
          description: Intervallo attuale
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Intervallo' }
        '401': { $ref: '#/components/responses/NonIdentificato' }
        '403': { $ref: '#/components/responses/NonAutorizzato' }
        '500': { $ref: '#/components/responses/ErroreInterno' }
        '503': { $ref: '#/components/responses/NonDisponibile' }
    put:
      tags: [posizioni]
      summary: Modifica l'intervallo di invio della posizione
      description: Solo amministratori. L'intervallo va da 5 a 3600 secondi; la modifica registra l'amministratore e l'ora.
      operationId: modificaIntervalloPosizione
      security:
        - amministratore: []
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/Intervallo' }
            example: { intervallo_secondi: 30 }
      responses:
        '200':
          description: Intervallo aggiornato
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Intervallo' }
        '400':
          description: Intervallo mancante o fuori dal range 5–3600
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Errore' }
        '401': { $ref: '#/components/responses/NonIdentificato' }
        '403': { $ref: '#/components/responses/NonAutorizzato' }
        '415': { $ref: '#/components/responses/NonJSON' }
        '500': { $ref: '#/components/responses/ErroreInterno' }
        '503': { $ref: '#/components/responses/NonDisponibile' }

components:
  securitySchemes:
    bearer:
      type: http
      scheme: bearer
      bearerFormat: JWT
      description: Token ottenuto da POST /api/auth/login
    operatore:
      type: apiKey
      in: header
      name: X-Id-Operatore
      description: Token Bearer di un utente con questo ruolo; solo in sviluppo anche questo header con l'id in operatori_logistici
    corriere:
      type: apiKey
      in: header
      name: X-Id-Corriere
      description: Token Bearer di un utente con questo ruolo; solo in sviluppo anche questo header con l'id in corrieri
    cliente:
      type: apiKey
      in: header
      name: X-Id-Cliente
      description: Token Bearer di un utente con questo ruolo; solo in sviluppo anche questo header con l'id in clienti
    amministratore:
      type: apiKey
      in: header
      name: X-Id-Amministratore
      description: Token Bearer di un utente con questo ruolo; solo in sviluppo anche questo header con l'id in amministratori

  parameters:
    IdSpedizione:
      name: id
      in: path
      required: true
      schema: { type: integer, format: int32, minimum: 1 }
    IdempotencyKey:
      name: Idempotency-Key
      in: header
      required: false
      description: |
        Chiave unica generata dal client (es. un UUID) per ogni operazione. Se la stessa
        richiesta arriva di nuovo con la stessa chiave (doppio clic, nuovo tentativo dopo
        un timeout) il server non la esegue una seconda volta e restituisce la risposta
        della prima, con l'header `Idempotent-Replayed: true`. Vale 24 ore, per utente e
        per percorso. La stessa chiave con dati diversi dà 409.
        Il server si ricorda solo le richieste riuscite (2xx): una richiesta rifiutata (400,
        403, 404, 409...) non ha cambiato nulla, quindi si può rimandare con la stessa
        chiave, anche con i dati corretti.
      schema: { type: string, minLength: 1, maxLength: 255 }

  responses:
    SpedizioneCreata:
      description: Operazione eseguita; il corpo è la spedizione aggiornata
      headers:
        Idempotent-Replayed:
          description: '`true` se è la ripetizione di una richiesta già eseguita con la stessa Idempotency-Key'
          schema: { type: string, enum: ['true'] }
      content:
        application/json:
          schema: { $ref: '#/components/schemas/Spedizione' }
    SpedizioneAggiornata:
      description: Spedizione aggiornata (oppure già nella situazione richiesta)
      headers:
        Idempotent-Replayed:
          description: '`true` se è la ripetizione di una richiesta già eseguita con la stessa Idempotency-Key'
          schema: { type: string, enum: ['true'] }
      content:
        application/json:
          schema: { $ref: '#/components/schemas/Spedizione' }
    NonIdentificato:
      description: Manca l'header con l'utente, oppure l'utente non esiste
      content:
        application/json:
          schema: { $ref: '#/components/schemas/Errore' }
    NonAutorizzato:
      description: Il ruolo non può fare questa operazione, oppure la spedizione non è assegnata al corriere che chiama
      content:
        application/json:
          schema: { $ref: '#/components/schemas/Errore' }
          example: { errore: la spedizione non è assegnata a te }
    NonTrovata:
      description: Spedizione inesistente
      content:
        application/json:
          schema: { $ref: '#/components/schemas/Errore' }
          example: { errore: spedizione non trovata }
    NonJSON:
      description: Il corpo non è JSON (Content-Type diverso da application/json)
      content:
        application/json:
          schema: { $ref: '#/components/schemas/Errore' }
    ErroreInterno:
      description: Errore del server; il dettaglio è solo nel log
      content:
        application/json:
          schema: { $ref: '#/components/schemas/Errore' }
          example: { errore: errore interno }
    NonDisponibile:
      description: 'Il database non risponde: si può riprovare dopo Retry-After secondi'
      headers:
        Retry-After:
          schema: { type: integer, example: 5 }
      content:
        application/json:
          schema: { $ref: '#/components/schemas/Errore' }
          example: { errore: 'servizio non disponibile, riprova' }

  schemas:
    Stato:
      type: string
      enum:
        - creata
        - assegnata
        - ritirata
        - persa
        - in consegna
        - consegnata
        - non consegnata
        - annullata

    NuovaSpedizione:
      type: object
      additionalProperties: false
      required:
        - cod_ordine
        - id_cliente_mittente
        - id_cliente_destinatario
        - dataora_richiesta_spedizione
        - id_indirizzo_ritiro
        - id_indirizzo_spedizione
      properties:
        cod_ordine:
          type: string
          minLength: 1
          maxLength: 50
          pattern: '^[A-Za-z0-9][A-Za-z0-9._/-]*$'
          description: Riferimento esterno dell'ordine, unico
        id_cliente_mittente: { type: integer, format: int32, minimum: 1 }
        id_cliente_destinatario: { type: integer, format: int32, minimum: 1 }
        dataora_richiesta_spedizione:
          type: string
          format: date-time
          description: Data e ora richieste per la spedizione, decise dall'operatore. ISO 8601 con fuso orario; può essere anche nel passato
        ritirata_il:
          type: string
          format: date-time
          description: |
            Non si invia: data e ora del ritiro le registra il sistema quando il corriere porta
            la spedizione in `ritirata`. Se presente la richiesta è rifiutata con 400 sul campo.
        id_indirizzo_ritiro: { type: integer, format: int32, minimum: 1 }
        id_indirizzo_spedizione:
          type: integer
          format: int32
          minimum: 1
          description: Diverso dall'indirizzo di ritiro
        id_corriere:
          type: integer
          format: int32
          minimum: 1
          description: Facoltativo; se presente la spedizione nasce già assegnata a questo corriere

    ModificaSpedizione:
      type: object
      additionalProperties: false
      minProperties: 1
      description: Solo i campi da cambiare
      properties:
        is_reso:
          type: boolean
          description: Solo su una spedizione annullata, persa o non consegnata
        id_cliente_mittente: { type: integer, format: int32, minimum: 1 }
        id_cliente_destinatario: { type: integer, format: int32, minimum: 1 }
        dataora_richiesta_spedizione:
          type: string
          format: date-time
          description: Data e ora richieste per la spedizione, decise dall'operatore. ISO 8601 con fuso orario; può essere anche nel passato
        ritirata_il:
          type: string
          format: date-time
          description: |
            Non si invia: data e ora del ritiro le registra il sistema quando il corriere porta
            la spedizione in `ritirata`. Se presente la richiesta è rifiutata con 400 sul campo.
        id_indirizzo_ritiro: { type: integer, format: int32, minimum: 1 }
        id_indirizzo_spedizione: { type: integer, format: int32, minimum: 1 }

    Assegnazione:
      type: object
      additionalProperties: false
      required: [id_corriere]
      properties:
        id_corriere: { type: integer, format: int32, minimum: 1 }

    TentativoFallito:
      type: object
      additionalProperties: false
      required: [tipo, nota, motivo]
      properties:
        tipo:
          type: string
          enum: [ritiro, consegna]
        nota:
          type: string
          minLength: 1
          maxLength: 2000
          description: Nota interna (mai visibile al destinatario)
        motivo:
          description: |
            Un valore dell'elenco unico `Motivo`. Sempre obbligatorio; è l'unica parte della nota
            visibile al cliente.
          allOf:
            - $ref: '#/components/schemas/Motivo'

    CambioStato:
      type: object
      additionalProperties: false
      required: [stato]
      properties:
        stato:
          type: string
          enum: [ritirata, in consegna, consegnata, annullata, persa]
        nota:
          type: string
          minLength: 1
          maxLength: 2000
          description: Nota interna. Obbligatoria per `annullata` e `persa` (facoltativa annullando dopo 3 ritiri falliti), non ammessa con gli altri stati.
        motivo:
          description: |
            Un valore dell'elenco unico `Motivo`. Obbligatorio per `annullata` e `persa`;
            facoltativo annullando dopo 3 ritiri falliti; non ammesso con gli altri stati.
          allOf:
            - $ref: '#/components/schemas/Motivo'

    Motivo:
      type: string
      description: Elenco unico dei motivi pubblici, valido per tentativi e cambi di stato
      enum:
        - mittente assente
        - pacco non pronto
        - indirizzo di ritiro errato
        - destinatario assente
        - indirizzo errato
        - rifiutata dal destinatario
        - accesso impossibile
        - richiesta del mittente
        - richiesta del destinatario
        - dati della spedizione errati
        - ritiro non riuscito
        - smarrita in deposito
        - smarrita durante il trasporto
        - furto
        - altro

    Spedizione:
      type: object
      required:
        - id
        - cod_ordine
        - stato
        - is_reso
        - creata_il
        - dataora_richiesta_spedizione
        - ritirata_il
        - id_cliente_mittente
        - id_cliente_destinatario
        - id_indirizzo_ritiro
        - id_indirizzo_spedizione
        - id_corriere
        - annullata_il
        - tentativi_ritiro_falliti
        - tentativi_consegna_falliti
      properties:
        id: { type: integer, format: int32, example: 42 }
        cod_ordine: { type: string, example: ORD-2026-0001 }
        stato: { $ref: '#/components/schemas/Stato' }
        is_reso: { type: boolean }
        creata_il: { type: string, format: date-time }
        dataora_richiesta_spedizione:
          type: string
          format: date-time
          description: Data e ora richieste per la spedizione, decise dall'operatore
        ritirata_il:
          type: string
          format: date-time
          nullable: true
          description: Data e ora del ritiro, registrate al primo passaggio in `ritirata`; null prima
        id_cliente_mittente: { type: integer, format: int32 }
        id_cliente_destinatario: { type: integer, format: int32 }
        id_indirizzo_ritiro: { type: integer, format: int32 }
        id_indirizzo_spedizione: { type: integer, format: int32 }
        id_corriere:
          type: integer
          format: int32
          nullable: true
          description: Corriere dell'assegnazione attuale, null se non assegnata
        annullata_il:
          type: string
          format: date-time
          nullable: true
        tentativi_ritiro_falliti: { type: integer, minimum: 0 }
        tentativi_consegna_falliti: { type: integer, minimum: 0 }

    Indirizzo:
      type: object
      required: [via, civico, citta, cap, regione, nazione]
      properties:
        via: { type: string }
        civico: { type: string }
        citta: { type: string, nullable: true }
        cap: { type: string, nullable: true }
        regione: { type: string, nullable: true }
        nazione: { type: string, nullable: true }

    NuovoIndirizzo:
      type: object
      additionalProperties: false
      required: [via, civico, citta, cap, regione, nazione]
      description: Gli spazi iniziali e finali vengono tolti; ogni campo errato è segnalato in `dettagli`.
      properties:
        via: { type: string, maxLength: 150, description: Deve contenere almeno una lettera }
        civico:
          type: string
          maxLength: 10
          description: Numero con eventuale lettera o barra (es. 12, 12A, 12/B) oppure SNC
        citta: { type: string, maxLength: 100, description: 'Lettere, spazi, apostrofi, punti e trattini' }
        cap:
          type: string
          maxLength: 10
          description: 5 cifre se la nazione è Italia; altrimenti da 3 a 10 tra lettere, cifre, spazi e trattini
        regione: { type: string, maxLength: 100, description: 'Lettere, spazi, apostrofi, punti e trattini' }
        nazione: { type: string, maxLength: 100, description: 'Lettere, spazi, apostrofi, punti e trattini' }

    IndirizzoAnagrafica:
      type: object
      required: [id, via, civico, citta, cap, regione, nazione]
      properties:
        id: { type: integer, format: int32 }
        via: { type: string }
        civico: { type: string }
        citta: { type: string }
        cap: { type: string }
        regione: { type: string }
        nazione: { type: string }

    ListaIndirizzi:
      type: object
      required: [dati, pagina, per_pagina]
      properties:
        dati:
          type: array
          items: { $ref: '#/components/schemas/IndirizzoAnagrafica' }
        pagina: { type: integer }
        per_pagina: { type: integer }

    NuovoCliente:
      type: object
      additionalProperties: false
      required: [nome, cognome, prefisso, nr_telefono, email, password]
      properties:
        nome: { type: string, maxLength: 100 }
        cognome: { type: string, maxLength: 100 }
        prefisso: { type: string, pattern: '^\+[0-9]{1,4}$', example: '+39' }
        nr_telefono: { type: string, pattern: '^[0-9]{4,15}$' }
        email: { type: string, format: email, maxLength: 254 }
        password:
          type: string
          minLength: 8
          description: Viene inviata per mail al cliente

    Cliente:
      type: object
      required: [id, id_utente, nome, cognome, email, prefisso, nr_telefono]
      properties:
        id: { type: integer, format: int32, description: 'Id nella tabella clienti, da usare come id_cliente_mittente o id_cliente_destinatario' }
        id_utente: { type: integer, format: int32 }
        nome: { type: string }
        cognome: { type: string }
        email: { type: string }
        prefisso: { type: string }
        nr_telefono: { type: string }

    EsitoCliente:
      type: object
      required: [cliente, mail_inviata]
      properties:
        cliente: { $ref: '#/components/schemas/Cliente' }
        mail_inviata: { type: boolean, description: true se la mail con le credenziali è partita }

    Corriere:
      type: object
      required: [id, id_utente, nome, cognome, email, prefisso, nr_telefono]
      properties:
        id: { type: integer, format: int32, description: 'Id nella tabella corrieri, da usare come id_corriere' }
        id_utente: { type: integer, format: int32 }
        nome: { type: string }
        cognome: { type: string }
        email: { type: string }
        prefisso: { type: string }
        nr_telefono: { type: string }

    ListaCorrieri:
      type: object
      required: [dati, pagina, per_pagina]
      properties:
        dati:
          type: array
          items: { $ref: '#/components/schemas/Corriere' }
        pagina: { type: integer }
        per_pagina: { type: integer }

    ListaClienti:
      type: object
      required: [dati, pagina, per_pagina]
      properties:
        dati:
          type: array
          items: { $ref: '#/components/schemas/Cliente' }
        pagina: { type: integer }
        per_pagina: { type: integer }

    Persona:
      type: object
      required: [nome, cognome]
      description: |
        Dati di un cliente o del corriere, secondo chi chiama:
        - operatore e amministratore: mittente e destinatario con id, email e telefono;
          corriere con id e telefono;
        - corriere: mittente e destinatario con id, email e telefono; niente corriere;
        - cliente: mittente con nome, cognome, email e telefono (senza id), destinatario con id,
          email e telefono; niente corriere.
      properties:
        id: { type: integer, format: int32, description: 'Id nella tabella clienti o corrieri; assente per il mittente quando chiama il cliente' }
        nome: { type: string }
        cognome: { type: string }
        email: { type: string, description: Dei clienti; il corriere non ha l'email qui }
        telefono: { type: string, example: '+39 3330000005' }

    Autore:
      type: object
      required: [ruolo, id]
      properties:
        ruolo: { type: string, enum: [operatore, corriere] }
        id: { type: integer, format: int32 }
        nome: { type: string, description: Presente nello storico e nelle note (non per il cliente) }
        cognome: { type: string, description: Presente nello storico e nelle note (non per il cliente) }

    Motivi:
      type: object
      required: [dati]
      properties:
        dati:
          type: array
          items: { $ref: '#/components/schemas/Motivo' }
          description: |
            Elenco unico dei motivi ammessi, valido per ogni tentativo fallito e per i cambi di
            stato in `annullata` e `persa`: non è filtrato per stato o tipo di tentativo.

    NuovaNota:
      type: object
      required: [nota]
      properties:
        nota: { type: string, minLength: 1, maxLength: 2000 }
      additionalProperties: false

    Nota:
      type: object
      required: [id, is_interna, motivo, creata_il]
      properties:
        id: { type: integer, format: int32 }
        nota:
          type: string
          description: Testo della nota; assente per il cliente, che vede solo il `motivo`
        is_interna:
          type: boolean
          description: '`false` per le note dei tentativi e dei cambi di stato in annullata o persa'

        motivo: { type: string, nullable: true }
        creata_il: { type: string, format: date-time }
        autore:
          allOf: [{ $ref: '#/components/schemas/Autore' }]
          description: Chi ha scritto la nota; assente per il cliente

    VoceElenco:
      type: object
      required:
        - id
        - cod_ordine
        - stato
        - is_reso
        - creata_il
        - dataora_richiesta_spedizione
        - ritirata_il
        - id_cliente_destinatario
        - indirizzo_ritiro
        - indirizzo_spedizione
        - mittente
        - destinatario
        - conclusa_il
        - note
      properties:
        id: { type: integer, format: int32 }
        cod_ordine: { type: string }
        stato: { $ref: '#/components/schemas/Stato' }
        is_reso: { type: boolean }
        creata_il: { type: string, format: date-time }
        dataora_richiesta_spedizione: { type: string, format: date-time }
        ritirata_il:
          type: string
          format: date-time
          nullable: true
          description: Data e ora del ritiro, registrate al primo passaggio in `ritirata`; null prima
        id_cliente_mittente:
          type: integer
          format: int32
          description: Assente quando chiama il cliente
        id_cliente_destinatario: { type: integer, format: int32 }
        indirizzo_ritiro: { $ref: '#/components/schemas/Indirizzo' }
        indirizzo_spedizione: { $ref: '#/components/schemas/Indirizzo' }
        mittente: { $ref: '#/components/schemas/Persona' }
        destinatario: { $ref: '#/components/schemas/Persona' }
        id_corriere:
          type: integer
          format: int32
          nullable: true
          description: Presente solo per operatore e amministratore
        corriere:
          allOf: [{ $ref: '#/components/schemas/Persona' }]
          description: Solo per operatore e amministratore, e solo se la spedizione ha un corriere
        conclusa_il:
          type: string
          format: date-time
          nullable: true
          description: Quando la spedizione è entrata nello stato finale; null se è ancora in corso
        note:
          type: array
          items: { $ref: '#/components/schemas/Nota' }

    DettaglioSpedizione:
      allOf:
        - $ref: '#/components/schemas/VoceElenco'
        - type: object
          required: [annullata_il, tentativi_ritiro_falliti, tentativi_consegna_falliti]
          properties:
            annullata_il: { type: string, format: date-time, nullable: true }
            tentativi_ritiro_falliti: { type: integer, minimum: 0 }
            tentativi_consegna_falliti: { type: integer, minimum: 0 }

    ListaSpedizioni:
      type: object
      required: [dati, pagina, per_pagina]
      properties:
        dati:
          type: array
          items: { $ref: '#/components/schemas/VoceElenco' }
        pagina: { type: integer, minimum: 1 }
        per_pagina: { type: integer, minimum: 1, maximum: 100 }

    VoceStorico:
      type: object
      required: [id, operazione, valore_vecchio, valore_nuovo, modificato_il, autore]
      properties:
        id: { type: integer, format: int32 }
        operazione:
          type: string
          enum: [creazione, modifica, annullamento]
        valore_vecchio:
          type: object
          nullable: true
          additionalProperties: true
          description: Solo i campi cambiati, col valore precedente; null per la creazione
        valore_nuovo:
          type: object
          additionalProperties: true
          description: Solo i campi cambiati, col nuovo valore; la riga intera per la creazione
        modificato_il: { type: string, format: date-time }
        autore:
          allOf: [{ $ref: '#/components/schemas/Autore' }]
          description: Con nome e cognome di chi ha fatto la modifica

    Storico:
      type: object
      required: [dati]
      properties:
        dati:
          type: array
          items: { $ref: '#/components/schemas/VoceStorico' }

    NuovaPosizione:
      type: object
      additionalProperties: false
      required: [latitudine, longitudine]
      properties:
        latitudine: { type: number, minimum: -90, maximum: 90 }
        longitudine: { type: number, minimum: -180, maximum: 180 }

    Intervallo:
      type: object
      additionalProperties: false
      required: [intervallo_secondi]
      properties:
        intervallo_secondi: { type: integer, minimum: 5, maximum: 3600, example: 30 }

    PosizioneCorriere:
      type: object
      required: [id_corriere, nome, cognome, latitudine, longitudine, rilevata_il, spedizioni_attive]
      properties:
        id_corriere: { type: integer, format: int32 }
        nome: { type: string }
        cognome: { type: string }
        latitudine: { type: number }
        longitudine: { type: number }
        rilevata_il: { type: string, format: date-time }
        spedizioni_attive:
          type: array
          items: { type: integer, format: int32 }

    PosizioniCorrieri:
      type: object
      required: [intervallo_secondi, corrieri]
      properties:
        intervallo_secondi: { type: integer }
        corrieri:
          type: array
          items: { $ref: '#/components/schemas/PosizioneCorriere' }

    Login:
      type: object
      additionalProperties: false
      required: [email, password]
      properties:
        email: { type: string, format: email }
        password: { type: string }
        ruolo:
          type: string
          enum: [operatore, corriere, cliente, amministratore]
          description: Solo se l'utente ha più ruoli

    Sessione:
      type: object
      required: [token, tipo, scade_il, utente]
      properties:
        token: { type: string }
        tipo: { type: string, enum: [Bearer] }
        scade_il: { type: string, format: date-time }
        utente:
          type: object
          required: [id_utente, ruolo, id, nome, cognome, email]
          properties:
            id_utente: { type: integer, format: int32 }
            ruolo: { type: string, enum: [operatore, corriere, cliente, amministratore] }
            id:
              type: integer
              format: int32
              description: Id nella tabella del ruolo (operatori_logistici, corrieri, clienti, amministratori)
            nome: { type: string }
            cognome: { type: string }
            email: { type: string }

    CambioPassword:
      type: object
      additionalProperties: false
      required: [password_attuale, nuova_password]
      properties:
        password_attuale: { type: string }
        nuova_password: { type: string, minLength: 8, description: Da 8 caratteri a 72 byte }

    RecuperoPassword:
      type: object
      additionalProperties: false
      required: [email]
      properties:
        email: { type: string, format: email }

    ReimpostaPassword:
      type: object
      additionalProperties: false
      required: [token, nuova_password]
      properties:
        token: { type: string }
        nuova_password: { type: string, minLength: 8, description: Da 8 caratteri a 72 byte }

    Messaggio:
      type: object
      required: [messaggio]
      properties:
        messaggio: { type: string }

    Errore:
      type: object
      required: [errore]
      properties:
        errore:
          type: string
          description: Cosa è successo, senza dettagli interni
        dettagli:
          type: array
          description: Per gli errori sui dati, un elemento per ogni campo da correggere
          items:
            type: object
            required: [campo, messaggio]
            properties:
              campo: { type: string, example: nota }
              messaggio: { type: string, example: obbligatoria per un tentativo non riuscito }
