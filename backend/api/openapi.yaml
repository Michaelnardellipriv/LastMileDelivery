openapi: 3.0.3

info:
  title: LastMileDelivery API
  version: "0.47.0"
  description: |
    API per la gestione delle spedizioni di Veloce24.

    **Due servizi, un solo indirizzo.** L'API è servita da due microservizi, ognuno con il
    suo database: `spedizioni` (`/api/spedizioni`, `/api/corrieri/posizione`,
    `/api/corrieri/posizioni`, `/api/impostazioni`, `/api/motivi`, `/api/indirizzi`,
    `/api/sedi/{id}/impostazioni`) e `utenti` (tutto il resto: login, utenti, clienti,
    corrieri, sedi). L'Ingress manda ogni percorso al servizio giusto: per chi
    chiama è un'unica API. Se il servizio utenti non risponde, le spedizioni rispondono 503.

    Se il contratto e il codice divergono, il contratto ha vinto: va aggiornato
    nello stesso commit del codice.

    **Autenticazione.** Si fa il login con `POST /api/auth/login` (email e password) e si
    manda il token ricevuto in ogni richiesta: `Authorization: Bearer <token>`. Il token
    contiene ruolo, id, sede e la **sessione** del login (`sid`) e scade dopo `DURATA_TOKEN`
    (predefinito 15 minuti); si rinnova con `POST /api/auth/rinnova` finché la sessione è
    aperta, al massimo `DURATA_SESSIONE` (predefinito 12 ore) dal login.

    **Il token vale solo se la sua sessione è aperta nel database**, a ogni richiesta e su
    tutti e due i servizi. La sessione si chiude, e il token smette subito di valere, con:
    il logout (`POST /api/auth/esci`), la disattivazione dell'utente (poi 403 "account
    disattivato"), un cambio di sede (il token porta la sede) e una password nuova (cambio,
    recupero o nuova password dell'amministratore; chi la cambia tiene la sessione da cui
    l'ha cambiata). Una sessione chiusa risponde 401: si rifà il login.
    Negli schemi di sicurezza qui sotto `operatore`, `corriere`, `cliente`, `amministratore`
    indicano il ruolo richiesto: il token deve essere di un utente con quel ruolo.

    Solo per lo sviluppo, finché `IDENTITA_HEADER_SVILUPPO` vale `attiva` (predefinito), al
    posto del token si accetta ancora uno solo degli header `X-Id-Operatore`, `X-Id-Corriere`,
    `X-Id-Cliente`, `X-Id-Amministratore` (id nella tabella del ruolo). In produzione va
    impostata a `disattiva`.
    Clienti e amministratori possono solo leggere: il cliente l'elenco e il dettaglio
    delle sue spedizioni, l'amministratore l'elenco delle spedizioni di una sede alla volta
    (`id_sede` obbligatorio) e, per id, il dettaglio e lo storico di qualunque spedizione.
    L'amministratore non crea, modifica né elimina spedizioni, note o storico: tutte le
    altre operazioni rispondono 403, e non esistono endpoint di eliminazione.

    **Configurazione del server** (variabili d'ambiente): `DATABASE_URL` (obbligatoria: il
    database del servizio; per il servizio spedizioni è il database del gruppo 0, e
    `DATABASE_URL_1`, `DATABASE_URL_2`, ... sono i database degli altri gruppi di sedi,
    vedi **Sedi**), `URL_SERVIZIO_UTENTI` / `URL_SERVIZIO_SPEDIZIONI` e
    `CHIAVE_INTERNA` (per le chiamate tra i due servizi, vedi docs/microservizi.md),
    `CORS_ORIGIN` (obbligatoria: origini del frontend web ammesse dal browser, separate da
    virgola, senza percorso né barra finale, es. `http://localhost:5173`; `*` = tutte, solo
    sviluppo; le richieste senza `Origin`, come quelle delle app mobile, non ne dipendono),
    `LISTEN_ADDR` (predefinito `127.0.0.1:8080`), `JWT_SEGRETO` (almeno 32 caratteri; se
    manca se ne genera uno casuale a ogni avvio), `DURATA_TOKEN` (predefinito `15m`, almeno un minuto), `DURATA_SESSIONE` (predefinito `12h`, non minore di `DURATA_TOKEN`),
    `IDENTITA_HEADER_SVILUPPO` (`attiva` o `disattiva`), `LINK_RECUPERO_PASSWORD` (pagina del
    frontend a cui punta il link della mail, predefinita `http://localhost:5173/`; il backend
    aggiunge `?token=<token>`, quindi il valore non deve contenerlo), `SMTP_HOST`, `SMTP_PORT` (predefinito 587),
    `SMTP_UTENTE`, `SMTP_PASSWORD`, `SMTP_MITTENTE`. Senza `SMTP_HOST` le mail non vengono
    inviate ma scritte nel log del server.

    **Sedi.** Ogni città ha una sede (`/api/sedi`, le crea l'amministratore). Operatori e
    corrieri lavorano per una sede; una spedizione nasce nella sede dell'operatore che la
    crea, ha ritiro e consegna nella città della sede e si assegna solo a corrieri della
    stessa sede (409 altrimenti). Operatori e corrieri vedono solo i dati della propria sede:
    una spedizione di un'altra sede risponde 404, come se non esistesse. L'amministratore
    guarda l'elenco delle spedizioni **una sede alla volta**: in `GET /api/spedizioni`
    `id_sede` per lui è obbligatorio (400 senza, 404 se la sede non esiste) e non c'è una
    vista di tutte le sedi insieme; dettaglio e storico li legge per id, di qualunque sede.
    Il cliente vede le spedizioni destinate a lui in qualunque sede. Sul servizio utenti la
    sede si rilegge dal database a ogni richiesta; sul servizio spedizioni è quella del
    token, ma un cambio di sede chiude subito le sessioni dell'utente (vedi
    **Autenticazione**), quindi il token con la sede vecchia smette di valere su tutti e
    due i servizi e si rifà il login. Il database controlla una seconda volta con la
    Row-Level Security.

    **Gruppi di sedi (mappa sede → database).** Le sedi sono divise in gruppi e ogni
    gruppo ha il suo database delle spedizioni (le città grandi da sole, le piccole
    insieme). Il gruppo è `gruppo_spedizioni` della sede: si sceglie alla creazione
    (`POST /api/sedi`, predefinito 0, il gruppo principale) e poi non si cambia. Con il
    solo gruppo 0 tutto funziona come un unico database. Per chi chiama l'API non cambia
    niente: il servizio spedizioni sceglie il database da solo (la sede del token, l'id
    della spedizione o `id_sede`).

    **Parametri dell'amministratore.** Tentativi massimi di ritiro e di consegna, giorni di
    visibilità del cliente e intervallo della posizione non sono variabili d'ambiente: ogni
    sede ha i suoi, nella tabella `impostazioni`, e li modifica l'amministratore con
    `/api/sedi/{id}/impostazioni`. I motivi (`/api/impostazioni/motivi`) sono uguali per
    tutte le sedi. Valgono dalla richiesta successiva. Le tabelle qui sotto usano i
    valori predefiniti (3 tentativi).

    **ID.** Tutti gli id sono interi a 64 bit (`BIGINT` nel database). Gli id delle
    spedizioni (e di note, tentativi, storico) contengono il gruppo di sedi: nel database
    del gruppo g partono da g × 10^12 + 1, quindi il gruppo è `id / 10^12` (divisione
    intera) e un id non si ripete tra gruppi diversi. Restano sotto 2^53: numeri esatti
    anche in JavaScript. Chi chiama non deve farci niente: va solo trattato come un id.

    **Idempotenza.** Le richieste con `Idempotency-Key` sono salvate nel database (24 ore):
    una ripetizione trova la risposta anche se arriva a un'altra replica del backend o dopo
    un riavvio.

    **Utenti disattivati.** L'amministratore può disattivare corrieri, operatori e clienti
    destinatari (`PATCH /api/utenti/{id}`): il login risponde 403, i token già emessi ricevono
    403 a ogni richiesta, a un corriere disattivato non si assegnano spedizioni e un cliente
    disattivato non può essere destinatario di spedizioni nuove. I dati dei clienti li
    modifica anche l'operatore, ma non può disattivarli.

    **Sedi disattivate.** Una sede disattivata (`PATCH /api/sedi/{id}`) non accetta nuove
    spedizioni né nuovi corrieri o operatori; chi ci lavora chiude le spedizioni già aperte.

    **Ciclo di vita** (stati del tipo `stato_spedizione` del database):

    | Da | A | Chi | Endpoint |
    | :-- | :-- | :-- | :-- |
    | creata | assegnata | operatore | `POST /assegnazioni` |
    | assegnata, ritirata (questa solo dopo almeno un tentativo di consegna fallito) | stesso stato, altro corriere | operatore | `POST /assegnazioni` |
    | assegnata | assegnata (ritiro fallito) | corriere assegnato | `POST /tentativi` con `tipo: ritiro` |
    | assegnata | ritirata | corriere assegnato | `PATCH /stato` |
    | creata, assegnata | annullata (`motivo` e `nota` obbligatori, facoltativi dopo 3 ritiri falliti) | operatore | `PATCH /stato` |
    | ritirata | in consegna | corriere assegnato | `PATCH /stato` |
    | in consegna | consegnata (non nell'uscita in cui è già fallito un tentativo di consegna) | corriere assegnato | `PATCH /stato` |
    | in consegna | in consegna (consegna fallita, tentativi 1 e 2) | corriere assegnato | `POST /tentativi` con `tipo: consegna` |
    | in consegna | non consegnata (consegna fallita, 3° tentativo) | corriere assegnato | `POST /tentativi` con `tipo: consegna` |
    | in consegna | ritirata (solo con un tentativo di consegna fallito in questa uscita) | solo operatore | `PATCH /stato` |
    | ritirata, in consegna | persa (`motivo` e `nota` obbligatori) | operatore | `PATCH /stato` |

    Tentativi (`max_tentativi_ritiro` e `max_tentativi_consegna` della sede, predefinito 3):
    - ritiro: la spedizione resta `assegnata`; dopo il terzo il corriere non può più
      registrare tentativi né ritirarla, non si può riassegnare e la annulla l'operatore,
      senza dover ripetere `motivo` e `nota` (ci sono già quelli dei 3 tentativi);
    - consegna: ogni uscita in consegna (dall'ultimo passaggio a `in consegna`) ammette un
      solo tentativo. Ai tentativi 1 e 2 la spedizione resta `in consegna` ma l'uscita è
      chiusa: niente altro tentativo né consegna finché l'operatore non la riporta in
      `ritirata` (ed eventualmente la riassegna) e il corriere non la rimette `in consegna`.
      Al terzo passa da sola a `non consegnata`. L'operatore la riporta in `ritirata` solo
      dopo un tentativo di consegna fallito di questa uscita.

    Ogni tentativo (ritiro e consegna) richiede `motivo` e `nota`, e così i cambi di stato
    in `annullata` e `persa`. La `nota` è testo libero; il `motivo` è uno dei motivi attivi
    di `GET /api/motivi` (elenco unico gestito dall'amministratore), non filtrato per stato o
    tipo di tentativo.

    Metodi: `POST` per gli endpoint che creano qualcosa (spedizione, assegnazione,
    tentativo, nota), `PATCH` per quelli che modificano la spedizione (dati e stato).

    **Note.** Tutte le note stanno nella stessa tabella:
    - note pubbliche (`is_interna: false`): nascono solo con ogni tentativo di ritiro o
      di consegna (`POST /tentativi`) e con i cambi di stato in `annullata` o `persa`
      (`PATCH /stato`). Sono composte da un `motivo` pubblico e da una `nota` interna: al
      cliente arriva solo il `motivo`;
    - note interne (`is_interna: true`): si creano solo con `POST /api/spedizioni/{id}/note`.
      Gli altri cambi di stato non accettano la `nota`.

    Il cliente non vede mai le note interne né il testo o l'autore delle note pubbliche.

    I dati si modificano con `PATCH /api/spedizioni/{id}` solo finché la spedizione non
    è ritirata. Stati finali: consegnata, non consegnata, persa, annullata.

    `is_reso` lo imposta l'operatore con `PATCH /api/spedizioni/{id}`, solo quando la
    spedizione è `annullata`, `persa` o `non consegnata`. Alla creazione vale sempre `false`.

    Ogni cambio della spedizione è registrato nello storico (`cambiamenti_spedizioni`) con
    autore, data, valore precedente e nuovo. Ogni tentativo fallito è salvato in
    `tentativi` con la sua nota, che riporta il corriere che l'ha scritta.

servers:
  - url: http://localhost:8080
    description: Server locale di sviluppo

tags:
  - name: autenticazione
    description: Login, cambio e recupero della password
  - name: spedizioni
  - name: posizioni
    description: Posizione simulata dei corrieri (RF16) e intervallo di invio
  - name: amministrazione
    description: Parametri della gestione delle spedizioni, motivi e utenti (corrieri, operatori e clienti); l'operatore modifica solo i dati dei clienti
  - name: sedi
    description: Sedi operative (una per città), loro impostazioni, attivazione e disattivazione
  - name: anagrafiche
    description: |
      Clienti e indirizzi, per creare una spedizione dall'interfaccia: l'operatore cerca o
      crea mittente e destinatario (`/api/clienti`) e gli indirizzi di ritiro e consegna
      (`/api/indirizzi`), poi crea la spedizione con gli id ottenuti (`POST /api/spedizioni`).

paths:
  /api/auth/login:
    post:
      tags: [autenticazione]
      summary: Login con email e password
      description: |
        Restituisce il token da mandare in `Authorization: Bearer <token>`. L'email non
        distingue maiuscole e minuscole. Password sbagliata ed email sconosciuta danno lo
        stesso 401, per non rivelare quali email esistono. Ogni utente ha una password fin
        dalla creazione (obbligatoria nel database); al cliente destinatario la comunica
        l'operatore per mail.
        Tra i clienti entra solo chi è (o è stato) destinatario di almeno una spedizione: un
        cliente che è solo mittente, o che non ha ancora spedizioni in arrivo, riceve 403
        anche con le credenziali giuste.
        Se l'utente ha più ruoli (per esempio corriere e cliente) va indicato `ruolo`.
        Un utente disattivato dall'amministratore riceve 403, ma solo se la password è giusta.
      operationId: login
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/Login' }
            example: { email: destinatario@veloce24.test, password: LaMiaPassword1 }
      responses:
        '200':
          description: Login riuscito
          headers:
            Cache-Control:
              schema: { type: string, example: no-store }
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Sessione' }
              example:
                token: eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJzdWIiOiI0IiwicnVvbG8iOiJjbGllbnRlIiwiaWQiOjIsImlhdCI6MCwiZXhwIjowfQ.firma
                tipo: Bearer
                scade_il: '2026-11-09T18:00:00Z'
                durata_secondi: 900
                utente: { id_utente: 4, ruolo: cliente, id: 2, nome: Dora, cognome: Destinataria, email: destinatario@veloce24.test }
        '400':
          description: '`email` o `password` mancanti; utente con più ruoli senza `ruolo`'
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Errore' }
        '401':
          description: Email o password non corrette
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Errore' }
              example: { errore: email o password non corrette }
        '403':
          description: |
            `ruolo` indicato che l'utente non ha, cliente che non è destinatario di
            nessuna spedizione (solo mittente o senza spedizioni in arrivo), oppure utente
            disattivato dall'amministratore
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Errore' }
        '415': { $ref: '#/components/responses/NonJSON' }
        '500': { $ref: '#/components/responses/ErroreInterno' }
        '503': { $ref: '#/components/responses/NonDisponibile' }

  /api/auth/rinnova:
    post:
      tags: [autenticazione]
      summary: Rinnova il token
      description: |
        Con il token attuale (in `Authorization: Bearer`) restituisce un token nuovo, con la
        stessa forma del login e la stessa sessione. Accetta anche un token appena scaduto
        (app rimasta sospesa o senza rete), purché la sessione sia ancora aperta nel database
        e non oltre `DURATA_SESSIONE` dal login: la sessione ha una durata massima e un token
        rubato non si allunga all'infinito.
        - sessione chiusa (logout, disattivazione, cambio di sede, password nuova) o finita: 401;
        - utente disattivato: 403.
        L'app lo chiama da sola a metà della durata del token (`durata_secondi`), così un
        utente attivo non vede scadere la sessione prima di `DURATA_SESSIONE`.
      operationId: rinnovaToken
      security:
        - bearer: []
      responses:
        '200':
          description: Nuovo token
          headers:
            Cache-Control:
              schema: { type: string, example: no-store }
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Sessione' }
        '401':
          description: Token mancante o non valido, sessione oltre `DURATA_SESSIONE`, password cambiata dopo il login
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Errore' }
        '403':
          description: Utente disattivato dall'amministratore
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Errore' }
        '500': { $ref: '#/components/responses/ErroreInterno' }
        '503': { $ref: '#/components/responses/NonDisponibile' }

  /api/auth/esci:
    post:
      tags: [autenticazione]
      summary: Logout
      description: |
        Chiude la sessione del token: da subito il token non vale più, su tutti e due i
        servizi, e non si rinnova. Le altre sessioni dello stesso utente (altri dispositivi)
        restano aperte. Come il rinnovo accetta anche un token scaduto, entro
        `DURATA_SESSIONE` dal login; una sessione già chiusa risponde comunque 204.
      operationId: esci
      security:
        - bearer: []
      responses:
        '204': { description: Sessione chiusa (o già chiusa) }
        '401': { $ref: '#/components/responses/NonIdentificato' }
        '500': { $ref: '#/components/responses/ErroreInterno' }
        '503': { $ref: '#/components/responses/NonDisponibile' }

  /api/auth/cambio-password:
    post:
      tags: [autenticazione]
      summary: Cambio della propria password
      description: Per l'utente già autenticato. Serve la password attuale.
      operationId: cambiaPassword
      security:
        - operatore: []
        - corriere: []
        - cliente: []
        - amministratore: []
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/CambioPassword' }
            example: { password_attuale: LaMiaPassword1, nuova_password: LaNuovaPassword2 }
      responses:
        '204': { description: Password cambiata }
        '400':
          description: Campi mancanti; nuova password sotto gli 8 caratteri, oltre i 72 byte o uguale all'attuale
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Errore' }
        '401': { $ref: '#/components/responses/NonIdentificato' }
        '403':
          description: Password attuale non corretta
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Errore' }
        '415': { $ref: '#/components/responses/NonJSON' }
        '500': { $ref: '#/components/responses/ErroreInterno' }
        '503': { $ref: '#/components/responses/NonDisponibile' }

  /api/auth/recupero-password:
    post:
      tags: [autenticazione]
      summary: Richiesta di recupero della password via mail
      description: |
        Per chi ha dimenticato la password: se l'email è registrata, invia una mail con un
        link valido 30 minuti per sceglierne una nuova. La risposta è sempre
        202, anche per email sconosciute, per non rivelare quali email esistono. Una nuova
        richiesta annulla i link precedenti; oltre 3 richieste nell'ultima ora per lo stesso
        utente la mail non viene inviata. Il link è `LINK_RECUPERO_PASSWORD?token=<token>`, per esempio
        `http://localhost:5173/?token=<token>`: apre il frontend, che legge il token e chiede la nuova password.
      operationId: richiediRecuperoPassword
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/RecuperoPassword' }
            example: { email: destinatario@veloce24.test }
      responses:
        '202':
          description: Richiesta presa in carico
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Messaggio' }
        '400':
          description: '`email` mancante'
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Errore' }
        '415': { $ref: '#/components/responses/NonJSON' }
        '500': { $ref: '#/components/responses/ErroreInterno' }
        '503': { $ref: '#/components/responses/NonDisponibile' }

  /api/auth/reimposta-password:
    post:
      tags: [autenticazione]
      summary: Nuova password con il token ricevuto per mail
      description: Il token vale una sola volta e per 30 minuti.
      operationId: reimpostaPassword
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/ReimpostaPassword' }
            example: { token: NNwZnQuouqNT2e5W0BxoqrNfne0D8KZ_SJoLqnoKkPM, nuova_password: LaNuovaPassword2 }
      responses:
        '204': { description: Password impostata }
        '400':
          description: Token mancante, non valido, scaduto o già usato; nuova password non valida
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Errore' }
        '415': { $ref: '#/components/responses/NonJSON' }
        '500': { $ref: '#/components/responses/ErroreInterno' }
        '503': { $ref: '#/components/responses/NonDisponibile' }

  /api/spedizioni:
    get:
      tags: [spedizioni]
      summary: Elenca le spedizioni visibili a chi chiama
      description: |
        Il contenuto dipende dal ruolo:

        | Ruolo | Spedizioni restituite | Note | `id_corriere` |
        | :-- | :-- | :-- | :-- |
        | operatore | tutte quelle della sua sede, in tutti gli stati | tutte | sì |
        | amministratore | tutte quelle della sede scelta con `id_sede` (obbligatorio), in tutti gli stati | tutte | sì |
        | corriere | solo quelle assegnate a lui, finché non sono concluse (`assegnata`, `ritirata`, `in consegna`) | tutte | no |
        | cliente | solo quelle di cui è destinatario: quelle in corso sempre, quelle chiuse (consegnata, non consegnata, persa, annullata) fino a `giorni_visibilita_cliente` giorni dalla chiusura (impostati dall'amministratore, predefinito 30) | solo il `motivo` (e la data) delle note pubbliche | no |

        La data di chiusura (`conclusa_il`) è quella in cui la spedizione è entrata nello
        stato finale, presa dallo storico.

        Ordinate dalla più recente. I filtri si applicano dentro ciò che il ruolo può già
        vedere (un corriere che chiede `stato=consegnata` riceve una lista vuota) e si
        possono combinare.

        **L'amministratore sceglie sempre una sede**: senza `id_sede` risponde 400 (campo
        `id_sede`), con una sede che non esiste 404 "sede non trovata". Non c'è un elenco
        di tutte le sedi insieme: ogni gruppo di sedi ha il suo database delle spedizioni.
        L'elenco del cliente invece comprende tutte le sedi (legge tutti i gruppi e unisce
        i risultati, con lo stesso ordine e `totale_elementi` sommato).
      operationId: elencaSpedizioni
      security:
        - operatore: []
        - corriere: []
        - cliente: []
        - amministratore: []
      parameters:
        - name: stato
          in: query
          required: false
          schema: { $ref: '#/components/schemas/Stato' }
        - name: id_corriere
          in: query
          required: false
          description: Solo le spedizioni assegnate a questo corriere. Solo per operatore e amministratore (altrimenti 403).
          schema: { type: integer, format: int64, minimum: 1 }
        - name: id_sede
          in: query
          required: false
          description: |
            Solo le spedizioni di questa sede. **Obbligatorio per l'amministratore** (senza:
            400; sede inesistente: 404), che vede l'elenco di una sede alla volta. Operatori e
            corrieri non ne hanno bisogno, vedono già solo la propria (possono indicare solo
            quella; un'altra sede: 403); il cliente non lo usa.
          schema: { type: integer, format: int64, minimum: 1 }
        - name: dal
          in: query
          required: false
          description: Data di creazione minima, inclusa (AAAA-MM-GG, ora italiana)
          schema: { type: string, format: date, example: '2026-11-01' }
        - name: al
          in: query
          required: false
          description: Data di creazione massima, inclusa (AAAA-MM-GG, ora italiana); non prima di `dal`
          schema: { type: string, format: date, example: '2026-11-30' }
        - name: cod_ordine
          in: query
          required: false
          description: Riferimento della spedizione; trova i codici che lo contengono, senza distinguere maiuscole e minuscole
          schema: { type: string, minLength: 1, maxLength: 50, example: ORD-2026 }
        - name: pagina
          in: query
          required: false
          description: Numero di pagina, da 1
          schema: { type: integer, minimum: 1, default: 1 }
        - name: per_pagina
          in: query
          required: false
          description: Spedizioni per pagina
          schema: { type: integer, minimum: 1, maximum: 100, default: 10 }
      responses:
        '200':
          description: Elenco (può essere vuoto)
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ListaSpedizioni' }
              example:
                dati:
                  - id: 2
                    cod_ordine: ORD-2
                    stato: ritirata
                    is_reso: false
                    creata_il: '2026-10-27T21:00:00Z'
                    dataora_richiesta_spedizione: '2026-10-28T09:00:00Z'
                    id_cliente_mittente: 1
                    id_cliente_destinatario: 2
                    indirizzo_ritiro: { via: Via Roma, civico: '1' }
                    indirizzo_spedizione: { via: Via Verdi, civico: '10' }
                    id_corriere: 1
                    conclusa_il: null
                    note:
                      - { id: 1, nota: Il mittente ha annullato l'ordine, is_interna: false, motivo: richiesta del mittente, creata_il: '2026-10-27T21:01:00Z' }
                pagina: 1
                per_pagina: 20
                totale_elementi: 1
                totale_pagine: 1
        '400':
          description: |
            Parametro non valido (`stato`, `id_corriere`, `id_sede`, `dal`, `al`, `cod_ordine`,
            `pagina` o `per_pagina`), oppure `id_sede` mancante per l'amministratore
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Errore' }
              examples:
                sede_mancante:
                  summary: L'amministratore non ha scelto la sede
                  value:
                    errore: dati non validi
                    dettagli:
                      - { campo: id_sede, messaggio: "obbligatorio per l'amministratore: scegliere una sede" }
        '401': { $ref: '#/components/responses/NonIdentificato' }
        '403':
          description: |
            Filtro `id_corriere` usato da un corriere o da un cliente, oppure `id_sede` di
            un'altra sede chiesto da un operatore o da un corriere
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Errore' }
        '404':
          description: L'amministratore ha indicato in `id_sede` una sede che non esiste
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Errore' }
              example: { errore: sede non trovata }
        '500': { $ref: '#/components/responses/ErroreInterno' }
        '503': { $ref: '#/components/responses/NonDisponibile' }

    post:
      tags: [spedizioni]
      summary: Crea una spedizione
      description: |
        L'operatore logistico crea una spedizione con clienti e indirizzi già esistenti
        (cercati o creati con `/api/clienti` e `/api/indirizzi`). Senza `id_corriere` nasce
        `creata`; con `id_corriere` (scelto da `GET /api/corrieri`) nasce già `assegnata` a quel
        corriere, nella stessa operazione, e lo storico registra creazione e assegnazione.
        `cod_ordine` è il riferimento esterno (es. l'ordine dell'e-commerce) ed è unico nel
        database del gruppo di sedi dell'operatore (con un solo gruppo: unico ovunque).
      operationId: creaSpedizione
      security:
        - operatore: []
      parameters:
        - $ref: '#/components/parameters/IdempotencyKey'
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/NuovaSpedizione' }
            example:
              cod_ordine: ORD-2026-0001
              id_cliente_mittente: 1
              id_cliente_destinatario: 2
              dataora_richiesta_spedizione: '2026-11-02T09:00:00+01:00'
              id_indirizzo_ritiro: 1
              id_indirizzo_spedizione: 2
      responses:
        '201': { $ref: '#/components/responses/SpedizioneCreata' }
        '400':
          description: |
            Dati non validi: JSON malformato, campo mancante o non previsto, tipo errato,
            data non ISO 8601 o nel futuro, `ritirata_il` inviata dal client (la decide il
            sistema), cliente o indirizzo inesistente, indirizzi uguali.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Errore' }
              example:
                errore: dati non validi
                dettagli:
                  - { campo: id_cliente_destinatario, messaggio: obbligatorio }
                  - { campo: cod_ordine, messaggio: 'solo lettere, cifre e . _ / - senza spazi' }
        '401': { $ref: '#/components/responses/NonIdentificato' }
        '403': { $ref: '#/components/responses/NonAutorizzato' }
        '409':
          description: |
            Codice ordine già usato, `id_corriere` di un'altra sede o disattivato, destinatario
            disattivato dall'amministratore (errore sul campo `id_cliente_destinatario`), sede
            dell'operatore disattivata, oppure Idempotency-Key già usata con dati diversi. La
            spedizione nasce nella sede dell'operatore: indirizzi di ritiro o consegna fuori
            dalla sua città rispondono 400.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Errore' }
        '415': { $ref: '#/components/responses/NonJSON' }
        '500': { $ref: '#/components/responses/ErroreInterno' }
        '503': { $ref: '#/components/responses/NonDisponibile' }

  /api/spedizioni/{id}:
    parameters:
      - $ref: '#/components/parameters/IdSpedizione'
    get:
      tags: [spedizioni]
      summary: Dettaglio di una spedizione
      description: |
        Una spedizione con indirizzi, corriere, tentativi falliti, date e note.
        Le regole di visibilità sono quelle dell'elenco:

        | Chi | Vede |
        | :-- | :-- |
        | operatore | qualsiasi spedizione della sua sede, con corriere, note interne e autori delle note |
        | amministratore | qualsiasi spedizione di qualunque sede (non serve `id_sede`: l'id dice in quale database sta), con corriere, note interne e autori delle note |
        | corriere | solo le spedizioni assegnate a lui in `assegnata`, `ritirata`, `in consegna`, con note interne |
        | cliente | solo quelle di cui è destinatario, fino a `giorni_visibilita_cliente` giorni dalla chiusura (impostati dall'amministratore); senza corriere; delle note vede solo il `motivo` di quelle pubbliche (tentativi, annullata, persa) |

        Una spedizione che il richiedente non può vedere risponde 404, come se non esistesse.
      operationId: dettaglioSpedizione
      security:
        - operatore: []
        - corriere: []
        - cliente: []
        - amministratore: []
      responses:
        '200':
          description: Dettaglio della spedizione
          content:
            application/json:
              schema: { $ref: '#/components/schemas/DettaglioSpedizione' }
              example:
                id: 42
                cod_ordine: ORD-2026-0001
                stato: ritirata
                is_reso: false
                creata_il: '2026-11-01T09:00:00Z'
                dataora_richiesta_spedizione: '2026-11-02T09:00:00Z'
                id_cliente_mittente: 3
                id_cliente_destinatario: 5
                indirizzo_ritiro: { via: Via Roma, civico: '10' }
                indirizzo_spedizione: { via: Corso Italia, civico: 5B }
                id_corriere: 1
                conclusa_il: null
                annullata_il: null
                tentativi_ritiro_falliti: 1
                tentativi_consegna_falliti: 0
                note:
                  - id: 7
                    nota: Magazzino del mittente chiuso
                    is_interna: true
                    motivo: mittente assente
                    creata_il: '2026-11-01T10:00:00Z'
                    autore: { ruolo: corriere, id: 1 }
        '400':
          description: Id non valido
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Errore' }
        '401': { $ref: '#/components/responses/NonIdentificato' }
        '404': { $ref: '#/components/responses/NonTrovata' }
        '500': { $ref: '#/components/responses/ErroreInterno' }
        '503': { $ref: '#/components/responses/NonDisponibile' }

    patch:
      tags: [spedizioni]
      summary: Modifica i dati di una spedizione
      description: |
        L'operatore modifica la spedizione mandando solo i campi da cambiare.
        - `is_reso`: solo se la spedizione è `annullata`, `persa` o `non consegnata`;
        - tutti gli altri campi: solo finché non è ritirata (stati `creata` e `assegnata`).

        `cod_ordine`, lo stato e il corriere non si cambiano qui. Inviare gli stessi
        valori non scrive nello storico.
      operationId: modificaSpedizione
      security:
        - operatore: []
      parameters:
        - $ref: '#/components/parameters/IdempotencyKey'
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/ModificaSpedizione' }
            examples:
              dati:
                summary: Cambia indirizzo e data richiesta (spedizione creata o assegnata)
                value:
                  id_indirizzo_spedizione: 3
                  dataora_richiesta_spedizione: '2026-11-03T14:00:00+01:00'
              reso:
                summary: Segna come reso (spedizione annullata, persa o non consegnata)
                value:
                  is_reso: true
      responses:
        '200': { $ref: '#/components/responses/SpedizioneAggiornata' }
        '400':
          description: |
            Dati non validi: nessun campo, campo non previsto, data non ISO 8601 o nel futuro, `ritirata_il`
            (la decide il sistema), riferimento inesistente, indirizzo di spedizione uguale a
            quello di ritiro.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Errore' }
        '401': { $ref: '#/components/responses/NonIdentificato' }
        '403': { $ref: '#/components/responses/NonAutorizzato' }
        '404': { $ref: '#/components/responses/NonTrovata' }
        '409':
          description: |
            Campi non modificabili nello stato attuale: dati dopo il ritiro, oppure
            `is_reso` su una spedizione non annullata, persa o non consegnata; oppure nuovo
            destinatario disattivato dall'amministratore (errore sul campo `id_cliente_destinatario`)
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Errore' }
        '415': { $ref: '#/components/responses/NonJSON' }
        '500': { $ref: '#/components/responses/ErroreInterno' }
        '503': { $ref: '#/components/responses/NonDisponibile' }

  /api/spedizioni/{id}/assegnazioni:
    parameters:
      - $ref: '#/components/parameters/IdSpedizione'
    post:
      tags: [spedizioni]
      summary: Assegna o riassegna la spedizione a un corriere
      description: |
        L'operatore crea una nuova assegnazione, che diventa quella corrente.
        - `creata`: la spedizione passa ad `assegnata`;
        - `assegnata` o `ritirata`: lo stato non cambia, cambia solo il corriere. Una
          spedizione `ritirata` si riassegna solo se ha avuto almeno un tentativo di
          consegna fallito (l'operatore l'ha riportata in `ritirata` per riprovare).

        Rispondere 201 vuol dire che è stata creata un'assegnazione; se il corriere è già
        quello assegnato non succede niente e risponde 200. In entrambi i casi il corpo è
        la spedizione aggiornata.
      operationId: assegnaSpedizione
      security:
        - operatore: []
      parameters:
        - $ref: '#/components/parameters/IdempotencyKey'
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/Assegnazione' }
            example: { id_corriere: 1 }
      responses:
        '200': { $ref: '#/components/responses/SpedizioneAggiornata' }
        '201': { $ref: '#/components/responses/SpedizioneCreata' }
        '400':
          description: '`id_corriere` mancante, non valido o inesistente'
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Errore' }
        '401': { $ref: '#/components/responses/NonIdentificato' }
        '403': { $ref: '#/components/responses/NonAutorizzato' }
        '404': { $ref: '#/components/responses/NonTrovata' }
        '409':
          description: |
            Spedizione in consegna o chiusa, tentativi di ritiro esauriti, spedizione ritirata
            senza tentativi di consegna falliti, oppure corriere di un'altra sede (una spedizione
            si assegna solo a corrieri della sua sede) o disattivato
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Errore' }
        '415': { $ref: '#/components/responses/NonJSON' }
        '500': { $ref: '#/components/responses/ErroreInterno' }
        '503': { $ref: '#/components/responses/NonDisponibile' }

  /api/spedizioni/{id}/tentativi:
    parameters:
      - $ref: '#/components/parameters/IdSpedizione'
    post:
      tags: [spedizioni]
      summary: Registra un tentativo di ritiro o di consegna non riuscito
      description: |
        Il corriere assegnato registra un tentativo fallito; lo stato lo decide il server.
        - `ritiro` (spedizione `assegnata`): resta `assegnata`; al massimo 3 tentativi;
        - `consegna` (spedizione `in consegna`): un solo tentativo per uscita; resta
          `in consegna` ai tentativi 1 e 2 (per riprovare l'operatore la riporta in
          `ritirata`), passa a `non consegnata` al terzo.

        `motivo` e `nota` sono sempre obbligatori e formano una nota pubblica: il cliente
        vede solo il `motivo`, la `nota` resta interna.

        Ogni richiesta registra un nuovo tentativo: per ripeterla senza danni usare
        `Idempotency-Key`. Il corpo della risposta è la spedizione aggiornata.
      operationId: registraTentativo
      security:
        - corriere: []
      parameters:
        - $ref: '#/components/parameters/IdempotencyKey'
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/TentativoFallito' }
            examples:
              ritiro:
                summary: Ritiro non riuscito
                value: { tipo: ritiro, motivo: mittente assente, nota: Magazzino del mittente chiuso }
              consegna:
                summary: Consegna non riuscita
                value: { tipo: consegna, motivo: destinatario assente, nota: Citofono rotto, nessuno risponde }
              ultimaConsegna:
                summary: Terzo tentativo di consegna (la spedizione diventa non consegnata)
                value: { tipo: consegna, motivo: destinatario assente, nota: Terzo passaggio, nessuno in casa }
      responses:
        '201': { $ref: '#/components/responses/SpedizioneCreata' }
        '400':
          description: '`tipo` mancante o sconosciuto, `nota` mancante o vuota, `motivo` mancante o fuori elenco'
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Errore' }
              example:
                errore: dati non validi
                dettagli:
                  - { campo: nota, messaggio: obbligatoria per ogni tentativo non riuscito }
        '401': { $ref: '#/components/responses/NonIdentificato' }
        '403': { $ref: '#/components/responses/NonAutorizzato' }
        '404': { $ref: '#/components/responses/NonTrovata' }
        '409':
          description: Spedizione nello stato sbagliato per quel tipo di tentativo, tentativi di ritiro esauriti, oppure tentativo di consegna già registrato in questa uscita (va prima riportata in ritirata dall'operatore)
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Errore' }
        '415': { $ref: '#/components/responses/NonJSON' }
        '500': { $ref: '#/components/responses/ErroreInterno' }
        '503': { $ref: '#/components/responses/NonDisponibile' }

  /api/spedizioni/{id}/note:
    parameters:
      - $ref: '#/components/parameters/IdSpedizione'
    post:
      tags: [spedizioni]
      summary: Aggiunge una nota operativa libera
      description: |
        Operatori e corrieri scrivono una nota interna sulla spedizione, in qualsiasi
        momento, senza cambiarne lo stato e senza righe nello storico. Le note libere
        sono sempre interne: le note pubbliche nascono solo con i tentativi e con i cambi
        di stato in annullata o persa.
        - operatore: su qualsiasi spedizione, in qualsiasi stato;
        - corriere: solo sulle spedizioni assegnate a lui in `ritirata` o `in consegna`
          (403 se non è sua, 409 negli altri stati, compresa `consegnata`).

        Ogni richiesta aggiunge una nota: per ripeterla senza duplicati usare
        `Idempotency-Key`.
      operationId: aggiungiNota
      security:
        - operatore: []
        - corriere: []
      parameters:
        - $ref: '#/components/parameters/IdempotencyKey'
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/NuovaNota' }
            examples:
              interna:
                summary: Nota interna
                value: { nota: Pacco fragile, maneggiare con cura }
      responses:
        '201':
          description: Nota salvata
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Nota' }
              example:
                id: 8
                nota: Pacco fragile, maneggiare con cura
                is_interna: true
                motivo: null
                creata_il: '2026-11-01T11:00:00Z'
                autore: { ruolo: operatore, id: 1 }
        '400':
          description: '`nota` mancante, vuota o oltre 2000 caratteri; campi diversi da `nota` (per esempio `is_interna`); id non valido'
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Errore' }
              example:
                errore: dati non validi
                dettagli:
                  - { campo: nota, messaggio: obbligatoria }
        '401': { $ref: '#/components/responses/NonIdentificato' }
        '403': { $ref: '#/components/responses/NonAutorizzato' }
        '404': { $ref: '#/components/responses/NonTrovata' }
        '409':
          description: Il corriere scrive su una spedizione che non è ritirata o in consegna
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Errore' }
        '415': { $ref: '#/components/responses/NonJSON' }
        '500': { $ref: '#/components/responses/ErroreInterno' }
        '503': { $ref: '#/components/responses/NonDisponibile' }

  /api/spedizioni/{id}/stato:
    parameters:
      - $ref: '#/components/parameters/IdSpedizione'
    patch:
      tags: [spedizioni]
      summary: Cambia lo stato di una spedizione
      description: |
        Solo i cambi di stato veri e propri:
        - corriere assegnato: `ritirata` (da assegnata), `in consegna`, `consegnata`;
        - operatore: `ritirata` (da in consegna, per riportarla indietro), `annullata`, `persa`.

        `annullata` e `persa` richiedono `motivo` (pubblico) e `nota` (interna). Fa eccezione
        l'annullamento dopo 3 ritiri falliti: `motivo` e `nota` sono facoltativi, ma se si
        indicano vanno indicati entrambi. Gli altri
        stati non accettano né `motivo` né `nota`: le note interne si scrivono con
        `POST /api/spedizioni/{id}/note`. `assegnata` si
        ottiene con `/assegnazioni`, `non consegnata` con `/tentativi`, `creata` mai.

        Chiedere di nuovo lo stato in cui la spedizione è già non cambia niente, non scrive
        nello storico e risponde 200.
      operationId: cambiaStatoSpedizione
      security:
        - operatore: []
        - corriere: []
      parameters:
        - $ref: '#/components/parameters/IdempotencyKey'
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/CambioStato' }
            examples:
              ritiro:
                summary: Il corriere ha ritirato il pacco
                value: { stato: ritirata }
              annullamento:
                summary: L'operatore annulla
                value: { stato: annullata, motivo: richiesta del mittente, nota: Il negozio ha chiamato alle 10 }
              persa:
                summary: L'operatore registra lo smarrimento
                value: { stato: persa, motivo: smarrita durante il trasporto, nota: Il corriere segnala che il pacco non è nel furgone }
              riportaInRitirata:
                summary: L'operatore riporta in ritirata dopo una consegna fallita
                value: { stato: ritirata }
      responses:
        '200': { $ref: '#/components/responses/SpedizioneAggiornata' }
        '400':
          description: Stato mancante, sconosciuto o che si imposta con un altro endpoint; `motivo` o `nota` mancanti per `annullata` o `persa` (dopo 3 ritiri falliti, uno solo dei due); `motivo` fuori elenco; `motivo` o `nota` presenti con altri stati
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Errore' }
        '401': { $ref: '#/components/responses/NonIdentificato' }
        '403': { $ref: '#/components/responses/NonAutorizzato' }
        '404': { $ref: '#/components/responses/NonTrovata' }
        '409':
          description: Transizione non ammessa dallo stato attuale, spedizione chiusa, tentativi di ritiro esauriti, consegna nell'uscita in cui è già stato registrato un tentativo fallito (va prima riportata in ritirata dall'operatore), oppure ritorno da `in consegna` a `ritirata` senza un tentativo di consegna fallito registrato in questa uscita
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Errore' }
              example: { errore: 'da "assegnata" non si può passare a "consegnata"' }
        '415': { $ref: '#/components/responses/NonJSON' }
        '500': { $ref: '#/components/responses/ErroreInterno' }
        '503': { $ref: '#/components/responses/NonDisponibile' }

  /api/spedizioni/{id}/storico:
    parameters:
      - $ref: '#/components/parameters/IdSpedizione'
    get:
      tags: [spedizioni]
      summary: Storico delle modifiche di una spedizione
      description: |
        Tutte le righe di `cambiamenti_spedizioni` della spedizione, dalla più vecchia:
        creazione, modifiche (dati, assegnazioni, cambi di stato, reso) e annullamento,
        con autore, data e valori prima e dopo. Visibile ad amministratori e operatori
        logistici.
      operationId: storicoSpedizione
      security:
        - amministratore: []
        - operatore: []
      responses:
        '200':
          description: Storico della spedizione
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Storico' }
              example:
                dati:
                  - id: 1
                    operazione: creazione
                    valore_vecchio: null
                    valore_nuovo: { id: 42, stato: creata, cod_ordine: ORD-2026-0001 }
                    modificato_il: '2026-11-01T09:00:00Z'
                    autore: { ruolo: operatore, id: 1, nome: Oscar, cognome: Operatore }
                  - id: 2
                    operazione: modifica
                    valore_vecchio: { stato: assegnata }
                    valore_nuovo: { stato: ritirata }
                    modificato_il: '2026-11-01T10:30:00Z'
                    autore: { ruolo: corriere, id: 1, nome: Carlo, cognome: Corriere }
        '400':
          description: Id non valido
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Errore' }
        '401': { $ref: '#/components/responses/NonIdentificato' }
        '403': { $ref: '#/components/responses/NonAutorizzato' }
        '404': { $ref: '#/components/responses/NonTrovata' }
        '500': { $ref: '#/components/responses/ErroreInterno' }
        '503': { $ref: '#/components/responses/NonDisponibile' }

  /api/motivi:
    get:
      tags: [spedizioni]
      summary: Motivi pubblici ammessi
      description: |
        Elenco unico dei motivi attivi che il cliente vede: i client lo mostrano in un menu a tendina.
        Sono gli unici valori accettati nel campo `motivo` di `POST /api/spedizioni/{id}/tentativi`
        e `PATCH /api/spedizioni/{id}/stato`; l'elenco non dipende dallo stato né dal tipo di
        tentativo. Lo gestisce l'amministratore con `/api/impostazioni/motivi`.
      operationId: elencoMotivi
      security:
        - operatore: []
        - corriere: []
        - cliente: []
        - amministratore: []
      responses:
        '200':
          description: Elenco dei motivi
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Motivi' }
              example:
                dati: [mittente assente, pacco non pronto, indirizzo di ritiro errato, destinatario assente,
                       indirizzo errato, rifiutata dal destinatario, accesso impossibile, richiesta del mittente,
                       richiesta del destinatario, dati della spedizione errati, ritiro non riuscito,
                       smarrita in deposito, smarrita durante il trasporto, furto, altro]
        '401': { $ref: '#/components/responses/NonIdentificato' }

  /api/clienti:
    get:
      tags: [anagrafiche]
      summary: Ricerca dei clienti
      description: |
        Operatori e amministratori. `q` cerca, senza distinguere maiuscole e minuscole, in
        nome e cognome (in qualsiasi ordine), email e numero di telefono; vuoto = tutti.
        Ordinati per cognome e nome.
      operationId: cercaClienti
      security:
        - operatore: []
        - amministratore: []
      parameters:
        - { name: q, in: query, required: false, schema: { type: string, maxLength: 100 } }
        - { name: pagina, in: query, required: false, schema: { type: integer, minimum: 1, default: 1 } }
        - { name: per_pagina, in: query, required: false, schema: { type: integer, minimum: 1, maximum: 100, default: 20 } }
      responses:
        '200':
          description: Clienti trovati
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ListaClienti' }
        '400':
          description: Parametri non validi
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Errore' }
        '401': { $ref: '#/components/responses/NonIdentificato' }
        '403': { $ref: '#/components/responses/NonAutorizzato' }
        '500': { $ref: '#/components/responses/ErroreInterno' }
        '503': { $ref: '#/components/responses/NonDisponibile' }
    post:
      tags: [anagrafiche]
      summary: Crea un cliente (mittente o destinatario)
      description: |
        Solo l'operatore. Crea l'utente con la `password` indicata dall'operatore (da 8
        caratteri a 72 byte, salvata come hash) e il cliente, poi invia al cliente una mail con
        email e password; `mail_inviata` dice se la mail è partita (il cliente resta creato
        anche se l'invio fallisce).

        Ogni email ha un solo ruolo: se è già usata da un qualsiasi utente (cliente, corriere,
        operatore o amministratore) risponde 409. Un cliente già registrato si cerca con
        `GET /api/clienti`. L'email non distingue maiuscole e minuscole.
      operationId: creaCliente
      security:
        - operatore: []
      parameters:
        - $ref: '#/components/parameters/IdempotencyKey'
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/NuovoCliente' }
            example: { nome: Giulia, cognome: Rossi, prefisso: '+39', nr_telefono: '3331234567', email: giulia.rossi@example.com, password: PasswordIniziale1 }
      responses:
        '201':
          description: Cliente creato
          content:
            application/json:
              schema: { $ref: '#/components/schemas/EsitoCliente' }
        '400':
          description: Campi mancanti o non validi, password compresa
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Errore' }
        '401': { $ref: '#/components/responses/NonIdentificato' }
        '403': { $ref: '#/components/responses/NonAutorizzato' }
        '409':
          description: Email già usata da un altro utente (con qualsiasi ruolo), oppure numero di telefono già usato
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Errore' }
        '415': { $ref: '#/components/responses/NonJSON' }
        '500': { $ref: '#/components/responses/ErroreInterno' }
        '503': { $ref: '#/components/responses/NonDisponibile' }

  /api/corrieri:
    get:
      tags: [anagrafiche]
      summary: Elenco dei corrieri
      description: |
        Operatori e amministratori: i corrieri attivi, anche quelli senza spedizioni, per
        scegliere a chi assegnare una spedizione o per il filtro `id_corriere` dell'elenco.
        I corrieri disattivati non compaiono: l'amministratore li trova con `GET /api/utenti`.
        `q` cerca, senza distinguere maiuscole e minuscole, in nome e cognome, email e
        telefono; vuoto = tutti. Ordinati per cognome e nome.
      operationId: elencaCorrieri
      security:
        - operatore: []
        - amministratore: []
      parameters:
        - { name: q, in: query, required: false, schema: { type: string, maxLength: 100 } }
        - { name: id_sede, in: query, required: false, description: "Solo l'amministratore filtra su qualunque sede; operatori e corrieri sono limitati alla propria", schema: { type: integer, format: int64, minimum: 1 } }
        - { name: pagina, in: query, required: false, schema: { type: integer, minimum: 1, default: 1 } }
        - { name: per_pagina, in: query, required: false, schema: { type: integer, minimum: 1, maximum: 100, default: 20 } }
      responses:
        '200':
          description: Corrieri trovati
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ListaCorrieri' }
        '400':
          description: Parametri non validi
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Errore' }
        '401': { $ref: '#/components/responses/NonIdentificato' }
        '403': { $ref: '#/components/responses/NonAutorizzato' }
        '500': { $ref: '#/components/responses/ErroreInterno' }
        '503': { $ref: '#/components/responses/NonDisponibile' }

  /api/indirizzi:
    get:
      tags: [anagrafiche]
      summary: Ricerca degli indirizzi
      description: |
        Operatori e amministratori. `q` cerca, senza distinguere maiuscole e minuscole, in via,
        civico, città e CAP; vuoto = tutti. Gli indirizzi di ritiro e consegna sono della sede
        (stanno nel database delle spedizioni del suo gruppo, servizio spedizioni): l'operatore
        vede quelli della sua sede, l'amministratore quelli della sede che sceglie con
        `id_sede`, **obbligatorio** per lui (senza: 400 sul campo `id_sede`; una sede che non
        esiste: 404).
      operationId: cercaIndirizzi
      security:
        - operatore: []
        - amministratore: []
      parameters:
        - { name: q, in: query, required: false, schema: { type: string, maxLength: 100 } }
        - { name: id_sede, in: query, required: false, description: "Obbligatorio per l'amministratore (una sede alla volta); l'operatore vede solo la propria (un'altra sede: 403)", schema: { type: integer, format: int64, minimum: 1 } }
        - { name: pagina, in: query, required: false, schema: { type: integer, minimum: 1, default: 1 } }
        - { name: per_pagina, in: query, required: false, schema: { type: integer, minimum: 1, maximum: 100, default: 20 } }
      responses:
        '200':
          description: Indirizzi trovati
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ListaIndirizzi' }
        '400':
          description: Parametri non validi
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Errore' }
        '401': { $ref: '#/components/responses/NonIdentificato' }
        '403': { $ref: '#/components/responses/NonAutorizzato' }
        '500': { $ref: '#/components/responses/ErroreInterno' }
        '503': { $ref: '#/components/responses/NonDisponibile' }
    post:
      tags: [anagrafiche]
      summary: Trova o crea un indirizzo
      description: |
        Solo l'operatore. Tutti i campi sono obbligatori. Città, regione e nazione devono essere
        quelle della sede dell'operatore (senza distinguere maiuscole e minuscole): l'indirizzo
        si salva nel database delle spedizioni del gruppo della sede, con la sede.
        Se nella stessa sede esiste già un indirizzo con la stessa via e lo stesso civico
        risponde 200 con quello, altrimenti lo crea e risponde 201. In entrambi i casi l'`id`
        si usa come `id_indirizzo_ritiro` o `id_indirizzo_spedizione` della spedizione.
        Ritiro e consegna restano nella città della sede dell'operatore: un indirizzo con
        città, regione o nazione diverse da quelle della sede risponde 400 sul campo `citta`.
        Il CAP sta sull'indirizzo (una città ne ha più d'uno).
      operationId: trovaOCreaIndirizzo
      security:
        - operatore: []
      parameters:
        - $ref: '#/components/parameters/IdempotencyKey'
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/NuovoIndirizzo' }
            example: { via: Via Dante, civico: '7', citta: Milano, cap: '20121', regione: Lombardia, nazione: Italia }
      responses:
        '200':
          description: Indirizzo già presente
          content:
            application/json:
              schema: { $ref: '#/components/schemas/IndirizzoAnagrafica' }
        '201':
          description: Indirizzo creato
          content:
            application/json:
              schema: { $ref: '#/components/schemas/IndirizzoAnagrafica' }
        '400':
          description: Campi mancanti o troppo lunghi
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Errore' }
        '401': { $ref: '#/components/responses/NonIdentificato' }
        '403': { $ref: '#/components/responses/NonAutorizzato' }
        '415': { $ref: '#/components/responses/NonJSON' }
        '500': { $ref: '#/components/responses/ErroreInterno' }
        '503': { $ref: '#/components/responses/NonDisponibile' }

  /api/corrieri/posizione:
    post:
      tags: [posizioni]
      summary: Il corriere invia la propria posizione (simulata)
      description: |
        Solo corrieri. La posizione viene salvata solo se il corriere ha almeno una
        spedizione `in consegna` e non più spesso dell'intervallo impostato
        dall'amministratore (con 2 secondi di tolleranza). La risposta dice ogni quanti
        secondi inviare la prossima. Il simulatore `go run ./cmd/simulatore-corriere`
        usa questo endpoint.
      operationId: inviaPosizione
      security:
        - corriere: []
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/NuovaPosizione' }
            example: { latitudine: 46.0679, longitudine: 11.1211 }
      responses:
        '201':
          description: Posizione salvata
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Intervallo' }
        '400':
          description: Coordinate mancanti o fuori range
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Errore' }
        '401': { $ref: '#/components/responses/NonIdentificato' }
        '403': { $ref: '#/components/responses/NonAutorizzato' }
        '409':
          description: Il corriere non ha spedizioni in consegna
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Errore' }
        '415': { $ref: '#/components/responses/NonJSON' }
        '429':
          description: Inviata prima che sia passato l'intervallo; `Retry-After` indica i secondi da attendere
          headers:
            Retry-After:
              schema: { type: integer }
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Errore' }
        '500': { $ref: '#/components/responses/ErroreInterno' }
        '503': { $ref: '#/components/responses/NonDisponibile' }

  /api/corrieri/posizioni:
    get:
      tags: [posizioni]
      summary: Ultima posizione dei corrieri con spedizioni in consegna
      description: |
        Solo operatori logistici. Per ogni corriere che ha ora spedizioni `in consegna`
        e ha inviato almeno una posizione: l'ultima posizione e le spedizioni in consegna.
        Chi ha finito le consegne non compare, anche se le sue posizioni restano salvate.
      operationId: elencaPosizioni
      security:
        - operatore: []
      responses:
        '200':
          description: Posizioni dei corrieri attivi
          content:
            application/json:
              schema: { $ref: '#/components/schemas/PosizioniCorrieri' }
              example:
                intervallo_secondi: 30
                corrieri:
                  - id_corriere: 1
                    nome: Carlo
                    cognome: Corriere
                    latitudine: 46.0679
                    longitudine: 11.1211
                    rilevata_il: '2026-11-04T10:00:00Z'
                    spedizioni_attive: [42, 43]
        '401': { $ref: '#/components/responses/NonIdentificato' }
        '403': { $ref: '#/components/responses/NonAutorizzato' }
        '500': { $ref: '#/components/responses/ErroreInterno' }
        '503': { $ref: '#/components/responses/NonDisponibile' }

  /api/impostazioni/intervallo-posizione:
    get:
      tags: [posizioni]
      summary: Ogni quanti secondi il corriere invia la posizione (sede di chi chiama)
      description: |
        Corrieri e operatori leggono l'intervallo della propria sede. L'amministratore non ha
        una sede: legge e cambia l'intervallo di ogni sede con `/api/sedi/{id}/impostazioni`
        (qui riceve 403, come il cliente).
      operationId: leggiIntervalloPosizione
      security:
        - corriere: []
        - operatore: []
      responses:
        '200':
          description: Intervallo attuale della sede
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Intervallo' }
        '401': { $ref: '#/components/responses/NonIdentificato' }
        '403': { $ref: '#/components/responses/NonAutorizzato' }
        '500': { $ref: '#/components/responses/ErroreInterno' }
        '503': { $ref: '#/components/responses/NonDisponibile' }

  /api/sedi:
    get:
      tags: [sedi]
      summary: Sedi
      description: |
        L'amministratore vede tutte le sedi; operatori e corrieri solo la propria; il cliente
        riceve 403. `q` cerca nel nome della sede e in città, regione e nazione.
      operationId: cercaSedi
      security:
        - amministratore: []
        - operatore: []
        - corriere: []
      parameters:
        - { name: q, in: query, required: false, schema: { type: string, maxLength: 100 } }
        - { name: attiva, in: query, required: false, description: 'true = solo attive, false = solo disattivate', schema: { type: boolean } }
        - { name: pagina, in: query, required: false, schema: { type: integer, minimum: 1, default: 1 } }
        - { name: per_pagina, in: query, required: false, schema: { type: integer, minimum: 1, maximum: 100, default: 20 } }
      responses:
        '200':
          description: Sedi trovate
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ListaSedi' }
        '400':
          description: Parametri non validi
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Errore' }
        '401': { $ref: '#/components/responses/NonIdentificato' }
        '403': { $ref: '#/components/responses/NonAutorizzato' }
        '500': { $ref: '#/components/responses/ErroreInterno' }
        '503': { $ref: '#/components/responses/NonDisponibile' }
    post:
      tags: [sedi]
      summary: Apre una sede in una città
      description: |
        Solo l'amministratore. Città, regione e nazione si ricavano dall'indirizzo, che si
        trova o si crea come con `POST /api/indirizzi` (stesse regole, errori sui campi
        `indirizzo.via`, `indirizzo.citta`, ...). Una sola sede per città (409). La sede nasce
        con le impostazioni predefinite.

        `gruppo_spedizioni` (facoltativo, predefinito 0) è il gruppo di sedi, cioè il
        database delle spedizioni in cui staranno le spedizioni della sede. Deve essere tra
        0 e 9006 e il gruppo deve avere un database configurato nel servizio spedizioni
        (`DATABASE_URL_<n>`), altrimenti 400 sul campo `gruppo_spedizioni` (il messaggio
        elenca i gruppi configurati). Dopo la creazione non si cambia: spostare una sede in
        un altro gruppo è una migrazione dei dati.
      operationId: creaSede
      security:
        - amministratore: []
      parameters:
        - $ref: '#/components/parameters/IdempotencyKey'
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/NuovaSede' }
            example:
              nome: Veloce24 Verona
              indirizzo: { via: Via Mazzini, civico: '5', cap: '37121', citta: Verona, regione: Veneto, nazione: Italia }
      responses:
        '201':
          description: Sede creata
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Sede' }
        '400':
          description: |
            Nome o indirizzo mancanti o non validi; `gruppo_spedizioni` fuori da 0..9006 o di
            un gruppo senza database delle spedizioni
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Errore' }
              examples:
                gruppo_senza_database:
                  summary: Il gruppo non ha un database delle spedizioni
                  value:
                    errore: dati non validi
                    dettagli:
                      - { campo: gruppo_spedizioni, messaggio: 'il gruppo 3 non ha un database delle spedizioni (gruppi configurati: [0 1])' }
        '401': { $ref: '#/components/responses/NonIdentificato' }
        '403': { $ref: '#/components/responses/NonAutorizzato' }
        '409':
          description: La città ha già una sede, oppure esiste già una sede con questo nome
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Errore' }
        '415': { $ref: '#/components/responses/NonJSON' }
        '500': { $ref: '#/components/responses/ErroreInterno' }
        '503': { $ref: '#/components/responses/NonDisponibile' }

  /api/sedi/{id}:
    parameters:
      - { name: id, in: path, required: true, schema: { type: integer, format: int64, minimum: 1 } }
    get:
      tags: [sedi]
      summary: Una sede
      description: L'amministratore vede ogni sede; operatori e corrieri solo la propria (altrimenti 403).
      operationId: leggiSede
      security:
        - amministratore: []
        - operatore: []
        - corriere: []
      responses:
        '200':
          description: La sede
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Sede' }
        '401': { $ref: '#/components/responses/NonIdentificato' }
        '403': { $ref: '#/components/responses/NonAutorizzato' }
        '404': { $ref: '#/components/responses/NonTrovata' }
        '500': { $ref: '#/components/responses/ErroreInterno' }
        '503': { $ref: '#/components/responses/NonDisponibile' }
    patch:
      tags: [sedi]
      summary: Modifica o disattiva una sede
      description: |
        Solo l'amministratore; partono solo i campi presenti. L'indirizzo, se c'è, va dato
        intero e deve essere nella città della sede (400 su `indirizzo.citta`): le spedizioni
        della sede sono legate alla sua città, che non cambia.

        Con `attiva: false` la sede non accetta nuove spedizioni (409 a `POST /api/spedizioni`)
        né nuovi corrieri o operatori (409 su `id_sede` in `POST /api/utenti` e
        `PATCH /api/utenti/{id}`). Chi ci lavora continua ad accedere e porta a termine le
        spedizioni già aperte. Con `attiva: true` torna come prima.

        `gruppo_spedizioni` non si cambia (400 sul campo `gruppo_spedizioni`): le spedizioni
        della sede sono nel database del suo gruppo.
      operationId: modificaSede
      security:
        - amministratore: []
      parameters:
        - $ref: '#/components/parameters/IdempotencyKey'
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/ModificaSede' }
            examples:
              rinomina: { value: { nome: Veloce24 Trento Centro } }
              disattiva: { value: { attiva: false } }
      responses:
        '200':
          description: Sede aggiornata
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Sede' }
        '400':
          description: Nessun campo, nome vuoto o troppo lungo, indirizzo non valido o in un'altra città, `gruppo_spedizioni` presente (non si cambia)
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Errore' }
        '401': { $ref: '#/components/responses/NonIdentificato' }
        '403': { $ref: '#/components/responses/NonAutorizzato' }
        '404': { $ref: '#/components/responses/NonTrovata' }
        '409':
          description: Esiste già una sede con questo nome
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Errore' }
        '415': { $ref: '#/components/responses/NonJSON' }
        '500': { $ref: '#/components/responses/ErroreInterno' }
        '503': { $ref: '#/components/responses/NonDisponibile' }

  /api/sedi/{id}/impostazioni:
    parameters:
      - { name: id, in: path, required: true, schema: { type: integer, format: int64, minimum: 1 } }
    get:
      tags: [sedi]
      summary: Parametri della gestione delle spedizioni di una sede
      description: L'amministratore li legge per ogni sede; operatori e corrieri solo per la propria (altrimenti 403).
      operationId: leggiImpostazioni
      security:
        - amministratore: []
        - operatore: []
        - corriere: []
      responses:
        '200':
          description: Impostazioni attuali della sede
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Impostazioni' }
        '401': { $ref: '#/components/responses/NonIdentificato' }
        '403': { $ref: '#/components/responses/NonAutorizzato' }
        '404': { $ref: '#/components/responses/NonTrovata' }
        '500': { $ref: '#/components/responses/ErroreInterno' }
        '503': { $ref: '#/components/responses/NonDisponibile' }
    patch:
      tags: [sedi]
      summary: Modifica uno o più parametri di una sede
      description: |
        Solo l'amministratore, che sceglie la sede e poi i parametri. Solo i campi presenti
        cambiano; la modifica registra l'amministratore e l'ora. I nuovi valori valgono dalla
        richiesta successiva, anche per le spedizioni già aperte della sede: per esempio,
        abbassando `max_tentativi_consegna` una spedizione arriva prima a `non consegnata`.
        Le altre sedi non cambiano.
      operationId: modificaImpostazioni
      security:
        - amministratore: []
      parameters:
        - $ref: '#/components/parameters/IdempotencyKey'
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/ModificaImpostazioni' }
            example: { max_tentativi_consegna: 2, giorni_visibilita_cliente: 60 }
      responses:
        '200':
          description: Impostazioni aggiornate
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Impostazioni' }
        '400':
          description: Corpo senza campi, campo sconosciuto o valore fuori limite
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Errore' }
        '401': { $ref: '#/components/responses/NonIdentificato' }
        '403': { $ref: '#/components/responses/NonAutorizzato' }
        '404': { $ref: '#/components/responses/NonTrovata' }
        '415': { $ref: '#/components/responses/NonJSON' }
        '500': { $ref: '#/components/responses/ErroreInterno' }
        '503': { $ref: '#/components/responses/NonDisponibile' }

  /api/impostazioni/motivi:
    get:
      tags: [amministrazione]
      summary: Tutti i motivi, anche quelli disattivati
      operationId: elencoMotiviAmministratore
      security:
        - amministratore: []
      responses:
        '200':
          description: Motivi in ordine di creazione
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ListaMotivi' }
        '401': { $ref: '#/components/responses/NonIdentificato' }
        '403': { $ref: '#/components/responses/NonAutorizzato' }
        '500': { $ref: '#/components/responses/ErroreInterno' }
        '503': { $ref: '#/components/responses/NonDisponibile' }
    post:
      tags: [amministrazione]
      summary: Aggiunge un motivo
      description: |
        Il motivo nasce attivo e compare subito in `GET /api/motivi`. Gli spazi in più nella
        descrizione vengono tolti. Una descrizione già presente (maiuscole e minuscole non contano)
        dà 409: se quel motivo è disattivato, si riattiva con `PATCH /api/impostazioni/motivi/{id}`.
      operationId: creaMotivo
      security:
        - amministratore: []
      parameters:
        - $ref: '#/components/parameters/IdempotencyKey'
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/NuovoMotivo' }
            example: { descrizione: cliente in ferie }
      responses:
        '201':
          description: Motivo creato
          content:
            application/json:
              schema: { $ref: '#/components/schemas/MotivoGestito' }
        '400':
          description: Descrizione mancante, vuota o più lunga di 100 caratteri
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Errore' }
        '401': { $ref: '#/components/responses/NonIdentificato' }
        '403': { $ref: '#/components/responses/NonAutorizzato' }
        '409':
          description: Esiste già un motivo con questa descrizione
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Errore' }
        '415': { $ref: '#/components/responses/NonJSON' }
        '500': { $ref: '#/components/responses/ErroreInterno' }
        '503': { $ref: '#/components/responses/NonDisponibile' }

  /api/impostazioni/motivi/{id}:
    parameters:
      - { name: id, in: path, required: true, schema: { type: integer, format: int64, minimum: 1 } }
    patch:
      tags: [amministrazione]
      summary: Attiva o disattiva un motivo
      description: |
        Un motivo non si cancella né si rinomina: si disattiva. Da quel momento non è più
        accettato nei tentativi e nei cambi di stato; le note che lo usano restano come sono.
        Deve restare almeno un motivo attivo.
      operationId: modificaMotivo
      security:
        - amministratore: []
      parameters:
        - $ref: '#/components/parameters/IdempotencyKey'
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/StatoAttivo' }
            example: { attivo: false }
      responses:
        '200':
          description: Motivo aggiornato
          content:
            application/json:
              schema: { $ref: '#/components/schemas/MotivoGestito' }
        '400':
          description: '`attivo` mancante o id non valido'
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Errore' }
        '401': { $ref: '#/components/responses/NonIdentificato' }
        '403': { $ref: '#/components/responses/NonAutorizzato' }
        '404':
          description: Motivo inesistente
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Errore' }
        '409':
          description: È l'ultimo motivo attivo
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Errore' }
        '415': { $ref: '#/components/responses/NonJSON' }
        '500': { $ref: '#/components/responses/ErroreInterno' }
        '503': { $ref: '#/components/responses/NonDisponibile' }

  /api/utenti:
    get:
      tags: [amministrazione]
      summary: Corrieri, operatori e clienti
      description: |
        Attivi e disattivati (gli amministratori non compaiono). `q` cerca come in
        `GET /api/clienti`; `ruolo` e `attivo` filtrano. Ordinati per cognome e nome.
        Per i clienti `destinatario` dice se hanno ricevuto almeno una spedizione.
      operationId: cercaUtenti
      security:
        - amministratore: []
      parameters:
        - { name: q, in: query, required: false, schema: { type: string, maxLength: 100 } }
        - { name: id_sede, in: query, required: false, description: "Solo l'amministratore filtra su qualunque sede; operatori e corrieri sono limitati alla propria", schema: { type: integer, format: int64, minimum: 1 } }
        - { name: ruolo, in: query, required: false, schema: { type: string, enum: [corriere, operatore, cliente] } }
        - { name: attivo, in: query, required: false, schema: { type: boolean } }
        - { name: pagina, in: query, required: false, schema: { type: integer, minimum: 1, default: 1 } }
        - { name: per_pagina, in: query, required: false, schema: { type: integer, minimum: 1, maximum: 100, default: 20 } }
      responses:
        '200':
          description: Utenti trovati
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ListaUtenti' }
        '400':
          description: Parametri non validi
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Errore' }
        '401': { $ref: '#/components/responses/NonIdentificato' }
        '403': { $ref: '#/components/responses/NonAutorizzato' }
        '500': { $ref: '#/components/responses/ErroreInterno' }
        '503': { $ref: '#/components/responses/NonDisponibile' }
    post:
      tags: [amministrazione]
      summary: Crea un corriere o un operatore
      description: |
        Crea l'utente con la `password` scelta dall'amministratore (salvata come hash) e gli
        invia una mail con email e password; `mail_inviata` dice se la mail è partita. Per i
        dati valgono le regole di `POST /api/clienti`, compresa l'email unica tra tutti i ruoli.
        I clienti destinatari li crea l'operatore con `POST /api/clienti`.
      operationId: creaUtente
      security:
        - amministratore: []
      parameters:
        - $ref: '#/components/parameters/IdempotencyKey'
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/NuovoUtente' }
            example: { ruolo: corriere, nome: Carlo, cognome: Rossi, prefisso: '+39', nr_telefono: '3331234567', email: carlo.rossi@veloce24.it, password: PasswordIniziale1 }
      responses:
        '201':
          description: Utente creato, attivo
          content:
            application/json:
              schema: { $ref: '#/components/schemas/EsitoUtente' }
        '400':
          description: Campi mancanti o non validi, `ruolo` diverso da corriere e operatore
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Errore' }
        '401': { $ref: '#/components/responses/NonIdentificato' }
        '403': { $ref: '#/components/responses/NonAutorizzato' }
        '409':
          description: Email già usata da un altro utente (con qualsiasi ruolo), oppure numero di telefono già usato
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Errore' }
        '415': { $ref: '#/components/responses/NonJSON' }
        '500': { $ref: '#/components/responses/ErroreInterno' }
        '503': { $ref: '#/components/responses/NonDisponibile' }

  /api/utenti/{id}:
    parameters:
      - name: id
        in: path
        required: true
        description: Id dell'utente (campo `id` di `Utente`, non `id_ruolo`)
        schema: { type: integer, format: int64, minimum: 1 }
    patch:
      tags: [amministrazione]
      summary: Modifica, abilita o disattiva un corriere, un operatore o un cliente
      description: |
        Il **ruolo** non si cambia: un corpo con `ruolo` risponde 400 sul campo `ruolo` (e un
        trigger nel database impedisce comunque di spostare o togliere il ruolo di un utente).
        Disattivazione, cambio di sede e nuova password chiudono subito le sessioni
        dell'utente: i suoi token smettono di valere su tutti e due i servizi.
        Cambia solo i campi presenti (almeno uno); il ruolo non si cambia. Per i dati valgono
        le regole di `POST /api/utenti`; l'email non può essere di un altro utente (409), la
        propria con maiuscole diverse sì. Con una nuova `password` l'utente la riceve per mail.

        Chi può fare cosa:
        - **amministratore**: dati, `password` e `attivo` di corrieri, operatori e clienti
          destinatari. Di un cliente solo mittente (mai destinatario: non accede all'app) solo
          i dati: con `password` o `attivo` risponde 409.
        - **operatore logistico**: solo i dati dei clienti (nome, cognome, prefisso,
          nr_telefono, email). `password` o `attivo`, oppure un corriere o un operatore, danno 403.
          Anche l'`email`, pure di chi usa l'app. A ogni cambio di email i link di recupero
          della password già mandati scadono.
        - gli amministratori non si modificano da qui (404).

        Un utente disattivato (`attivo: false`) non può fare il login (403), i token che aveva ricevono 403 a
        ogni richiesta e non riceve mail di recupero password. Un corriere disattivato non
        compare in `GET /api/corrieri` e non gli si assegnano spedizioni (409); quelle che
        aveva restano sue finché l'operatore non le riassegna. Un cliente disattivato non può
        essere destinatario di spedizioni nuove (409 su `POST /api/spedizioni` e
        `PATCH /api/spedizioni/{id}`); quelle che ha già restano sue. Con `attivo: true` torna
        tutto come prima.
      operationId: modificaUtente
      security:
        - amministratore: []
        - operatore: []
      parameters:
        - $ref: '#/components/parameters/IdempotencyKey'
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/ModificaUtente' }
            example: { cognome: Bianchi, nr_telefono: '3339998877' }
      responses:
        '200':
          description: Utente aggiornato
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Utente' }
        '400':
          description: Corpo vuoto, campo non valido o sconosciuto (anche `ruolo`), id non valido
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Errore' }
        '401': { $ref: '#/components/responses/NonIdentificato' }
        '403': { $ref: '#/components/responses/NonAutorizzato' }
        '404':
          description: Nessun corriere, operatore o cliente con questo id utente
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Errore' }
        '409':
          description: |
            Email già usata da un altro utente, numero di telefono già usato, oppure `password`
            o `attivo` per un cliente solo mittente
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Errore' }
        '415': { $ref: '#/components/responses/NonJSON' }
        '500': { $ref: '#/components/responses/ErroreInterno' }
        '503': { $ref: '#/components/responses/NonDisponibile' }

components:
  securitySchemes:
    bearer:
      type: http
      scheme: bearer
      bearerFormat: JWT
      description: Token ottenuto da POST /api/auth/login
    operatore:
      type: apiKey
      in: header
      name: X-Id-Operatore
      description: Token Bearer di un utente con questo ruolo; solo in sviluppo anche questo header con l'id in operatori_logistici
    corriere:
      type: apiKey
      in: header
      name: X-Id-Corriere
      description: Token Bearer di un utente con questo ruolo; solo in sviluppo anche questo header con l'id in corrieri
    cliente:
      type: apiKey
      in: header
      name: X-Id-Cliente
      description: Token Bearer di un utente con questo ruolo; solo in sviluppo anche questo header con l'id in clienti
    amministratore:
      type: apiKey
      in: header
      name: X-Id-Amministratore
      description: Token Bearer di un utente con questo ruolo; solo in sviluppo anche questo header con l'id in amministratori

  parameters:
    IdSpedizione:
      name: id
      in: path
      required: true
      schema: { type: integer, format: int64, minimum: 1 }
    IdempotencyKey:
      name: Idempotency-Key
      in: header
      required: false
      description: |
        Chiave unica generata dal client (es. un UUID) per ogni operazione. Se la stessa
        richiesta arriva di nuovo con la stessa chiave (doppio clic, nuovo tentativo dopo
        un timeout) il server non la esegue una seconda volta e restituisce la risposta
        della prima, con l'header `Idempotent-Replayed: true`. Vale 24 ore, per utente e
        per percorso. La stessa chiave con dati diversi dà 409.
        Il server si ricorda solo le richieste riuscite (2xx): una richiesta rifiutata (400,
        403, 404, 409...) non ha cambiato nulla, quindi si può rimandare con la stessa
        chiave, anche con i dati corretti.
      schema: { type: string, minLength: 1, maxLength: 255 }

  responses:
    SpedizioneCreata:
      description: Operazione eseguita; il corpo è la spedizione aggiornata
      headers:
        Idempotent-Replayed:
          description: '`true` se è la ripetizione di una richiesta già eseguita con la stessa Idempotency-Key'
          schema: { type: string, enum: ['true'] }
      content:
        application/json:
          schema: { $ref: '#/components/schemas/Spedizione' }
    SpedizioneAggiornata:
      description: Spedizione aggiornata (oppure già nella situazione richiesta)
      headers:
        Idempotent-Replayed:
          description: '`true` se è la ripetizione di una richiesta già eseguita con la stessa Idempotency-Key'
          schema: { type: string, enum: ['true'] }
      content:
        application/json:
          schema: { $ref: '#/components/schemas/Spedizione' }
    NonIdentificato:
      description: Manca l'header con l'utente, oppure l'utente non esiste
      content:
        application/json:
          schema: { $ref: '#/components/schemas/Errore' }
    NonAutorizzato:
      description: Il ruolo non può fare questa operazione, oppure la spedizione non è assegnata al corriere che chiama
      content:
        application/json:
          schema: { $ref: '#/components/schemas/Errore' }
          example: { errore: la spedizione non è assegnata a te }
    NonTrovata:
      description: Spedizione inesistente
      content:
        application/json:
          schema: { $ref: '#/components/schemas/Errore' }
          example: { errore: spedizione non trovata }
    NonJSON:
      description: Il corpo non è JSON (Content-Type diverso da application/json)
      content:
        application/json:
          schema: { $ref: '#/components/schemas/Errore' }
    ErroreInterno:
      description: Errore del server; il dettaglio è solo nel log
      content:
        application/json:
          schema: { $ref: '#/components/schemas/Errore' }
          example: { errore: errore interno }
    NonDisponibile:
      description: 'Il database non risponde: si può riprovare dopo Retry-After secondi'
      headers:
        Retry-After:
          schema: { type: integer, example: 5 }
      content:
        application/json:
          schema: { $ref: '#/components/schemas/Errore' }
          example: { errore: 'servizio non disponibile, riprova' }

  schemas:
    Stato:
      type: string
      enum:
        - creata
        - assegnata
        - ritirata
        - persa
        - in consegna
        - consegnata
        - non consegnata
        - annullata

    NuovaSpedizione:
      type: object
      additionalProperties: false
      required:
        - cod_ordine
        - id_cliente_mittente
        - id_cliente_destinatario
        - dataora_richiesta_spedizione
        - id_indirizzo_ritiro
        - id_indirizzo_spedizione
      properties:
        cod_ordine:
          type: string
          minLength: 1
          maxLength: 50
          pattern: '^[A-Za-z0-9][A-Za-z0-9._/-]*$'
          description: Riferimento esterno dell'ordine, unico
        id_cliente_mittente: { type: integer, format: int64, minimum: 1 }
        id_cliente_destinatario: { type: integer, format: int64, minimum: 1 }
        dataora_richiesta_spedizione:
          type: string
          format: date-time
          description: Momento in cui la spedizione è stata richiesta, indicato dall'operatore. ISO 8601 con fuso orario; uguale o precedente a adesso, mai nel futuro
        ritirata_il:
          type: string
          format: date-time
          description: |
            Non si invia: data e ora del ritiro le registra il sistema quando il corriere porta
            la spedizione in `ritirata`. Se presente la richiesta è rifiutata con 400 sul campo.
        id_indirizzo_ritiro: { type: integer, format: int64, minimum: 1 }
        id_indirizzo_spedizione:
          type: integer
          format: int64
          minimum: 1
          description: Diverso dall'indirizzo di ritiro
        id_corriere:
          type: integer
          format: int64
          minimum: 1
          description: Facoltativo; se presente la spedizione nasce già assegnata a questo corriere

    ModificaSpedizione:
      type: object
      additionalProperties: false
      minProperties: 1
      description: Solo i campi da cambiare
      properties:
        is_reso:
          type: boolean
          description: Solo su una spedizione annullata, persa o non consegnata
        id_cliente_mittente: { type: integer, format: int64, minimum: 1 }
        id_cliente_destinatario: { type: integer, format: int64, minimum: 1 }
        dataora_richiesta_spedizione:
          type: string
          format: date-time
          description: Momento in cui la spedizione è stata richiesta, indicato dall'operatore. ISO 8601 con fuso orario; uguale o precedente a adesso, mai nel futuro
        ritirata_il:
          type: string
          format: date-time
          description: |
            Non si invia: data e ora del ritiro le registra il sistema quando il corriere porta
            la spedizione in `ritirata`. Se presente la richiesta è rifiutata con 400 sul campo.
        id_indirizzo_ritiro: { type: integer, format: int64, minimum: 1 }
        id_indirizzo_spedizione: { type: integer, format: int64, minimum: 1 }

    Assegnazione:
      type: object
      additionalProperties: false
      required: [id_corriere]
      properties:
        id_corriere: { type: integer, format: int64, minimum: 1 }

    TentativoFallito:
      type: object
      additionalProperties: false
      required: [tipo, nota, motivo]
      properties:
        tipo:
          type: string
          enum: [ritiro, consegna]
        nota:
          type: string
          minLength: 1
          maxLength: 2000
          description: Nota interna (mai visibile al destinatario)
        motivo:
          description: |
            Un valore dell'elenco unico `Motivo`. Sempre obbligatorio; è l'unica parte della nota
            visibile al cliente.
          allOf:
            - $ref: '#/components/schemas/Motivo'

    CambioStato:
      type: object
      additionalProperties: false
      required: [stato]
      properties:
        stato:
          type: string
          enum: [ritirata, in consegna, consegnata, annullata, persa]
        nota:
          type: string
          minLength: 1
          maxLength: 2000
          description: Nota interna. Obbligatoria per `annullata` e `persa` (facoltativa annullando dopo 3 ritiri falliti), non ammessa con gli altri stati.
        motivo:
          description: |
            Un valore dell'elenco unico `Motivo`. Obbligatorio per `annullata` e `persa`;
            facoltativo annullando dopo 3 ritiri falliti; non ammesso con gli altri stati.
          allOf:
            - $ref: '#/components/schemas/Motivo'

    Motivo:
      type: string
      maxLength: 100
      description: |
        Uno dei motivi attivi di `GET /api/motivi`, valido per tentativi e cambi di stato.
        L'elenco lo gestisce l'amministratore; all'inizio contiene: mittente assente, pacco non
        pronto, indirizzo di ritiro errato, destinatario assente, indirizzo errato, rifiutata dal
        destinatario, accesso impossibile, richiesta del mittente, richiesta del destinatario,
        dati della spedizione errati, ritiro non riuscito, smarrita in deposito, smarrita durante
        il trasporto, furto, altro.
      example: destinatario assente

    Spedizione:
      type: object
      required:
        - id
        - cod_ordine
        - stato
        - is_reso
        - creata_il
        - dataora_richiesta_spedizione
        - ritirata_il
        - id_cliente_mittente
        - id_cliente_destinatario
        - id_indirizzo_ritiro
        - id_indirizzo_spedizione
        - id_corriere
        - annullata_il
        - tentativi_ritiro_falliti
        - tentativi_consegna_falliti
      properties:
        id: { type: integer, format: int64, example: 42 }
        id_sede: { type: integer, format: int64, description: Sede che gestisce la spedizione }
        cod_ordine: { type: string, example: ORD-2026-0001 }
        stato: { $ref: '#/components/schemas/Stato' }
        is_reso: { type: boolean }
        creata_il: { type: string, format: date-time }
        dataora_richiesta_spedizione:
          type: string
          format: date-time
          description: Momento in cui la spedizione è stata richiesta (mai nel futuro), indicato dall'operatore
        ritirata_il:
          type: string
          format: date-time
          nullable: true
          description: Data e ora del ritiro, registrate al primo passaggio in `ritirata`; null prima
        id_cliente_mittente: { type: integer, format: int64 }
        id_cliente_destinatario: { type: integer, format: int64 }
        id_indirizzo_ritiro: { type: integer, format: int64 }
        id_indirizzo_spedizione: { type: integer, format: int64 }
        id_corriere:
          type: integer
          format: int64
          nullable: true
          description: Corriere dell'assegnazione attuale, null se non assegnata
        annullata_il:
          type: string
          format: date-time
          nullable: true
        tentativi_ritiro_falliti: { type: integer, minimum: 0 }
        tentativi_consegna_falliti: { type: integer, minimum: 0 }

    Indirizzo:
      type: object
      required: [via, civico, citta, cap, regione, nazione]
      properties:
        via: { type: string }
        civico: { type: string }
        citta: { type: string, nullable: true }
        cap: { type: string, nullable: true }
        regione: { type: string, nullable: true }
        nazione: { type: string, nullable: true }

    NuovoIndirizzo:
      type: object
      additionalProperties: false
      required: [via, civico, citta, cap, regione, nazione]
      description: Gli spazi iniziali e finali vengono tolti; ogni campo errato è segnalato in `dettagli`.
      properties:
        via: { type: string, maxLength: 150, description: Deve contenere almeno una lettera }
        civico:
          type: string
          maxLength: 10
          description: Numero con eventuale lettera o barra (es. 12, 12A, 12/B) oppure SNC
        citta: { type: string, maxLength: 100, description: 'Lettere, spazi, apostrofi, punti e trattini' }
        cap:
          type: string
          maxLength: 10
          description: 5 cifre se la nazione è Italia; altrimenti da 3 a 10 tra lettere, cifre, spazi e trattini
        regione: { type: string, maxLength: 100, description: 'Lettere, spazi, apostrofi, punti e trattini' }
        nazione: { type: string, maxLength: 100, description: 'Lettere, spazi, apostrofi, punti e trattini' }

    IndirizzoAnagrafica:
      type: object
      required: [id, id_citta, via, civico, citta, cap, regione, nazione]
      properties:
        id: { type: integer, format: int64 }
        id_citta: { type: integer, format: int64, description: Ogni indirizzo è in una sola città }
        via: { type: string }
        civico: { type: string }
        citta: { type: string }
        cap: { type: string }
        regione: { type: string }
        nazione: { type: string }

    ListaIndirizzi:
      type: object
      required: [dati, pagina, per_pagina, totale_elementi, totale_pagine]
      properties:
        dati:
          type: array
          items: { $ref: '#/components/schemas/IndirizzoAnagrafica' }
        pagina: { type: integer }
        per_pagina: { type: integer }
        totale_elementi: { type: integer, minimum: 0, description: Elementi che rispettano i filtri, su tutte le pagine }
        totale_pagine: { type: integer, minimum: 0, description: 'Pagine necessarie con questo per_pagina (0 se non ci sono elementi); una pagina oltre la fine risponde con dati vuoti' }

    NuovoCliente:
      type: object
      additionalProperties: false
      required: [nome, cognome, prefisso, nr_telefono, email, password]
      properties:
        nome: { type: string, maxLength: 100 }
        cognome: { type: string, maxLength: 100 }
        prefisso: { type: string, pattern: '^\+[0-9]{1,4}$', example: '+39' }
        nr_telefono: { type: string, pattern: '^[0-9]{4,15}$' }
        email: { type: string, format: email, maxLength: 254 }
        password:
          type: string
          minLength: 8
          description: Viene inviata per mail al cliente

    Cliente:
      type: object
      required: [id, id_utente, nome, cognome, email, prefisso, nr_telefono, attivo, destinatario]
      properties:
        id: { type: integer, format: int64, description: 'Id nella tabella clienti, da usare come id_cliente_mittente o id_cliente_destinatario' }
        id_utente: { type: integer, format: int64, description: "Id dell'utente, da usare in PATCH /api/utenti/{id} per modificarne i dati" }
        nome: { type: string }
        cognome: { type: string }
        email: { type: string }
        prefisso: { type: string }
        nr_telefono: { type: string }
        attivo: { type: boolean, description: "false se l'amministratore l'ha disattivato: non può essere destinatario di nuove spedizioni" }
        destinatario:
          type: boolean
          description: |
            true se ha ricevuto almeno una spedizione (è un cliente destinatario e accede
            all'app), false se è un mittente, compreso un cliente appena creato

    EsitoCliente:
      type: object
      required: [cliente, mail_inviata]
      properties:
        cliente: { $ref: '#/components/schemas/Cliente' }
        mail_inviata: { type: boolean, description: true se la mail con le credenziali è partita }

    Corriere:
      type: object
      required: [id, id_utente, nome, cognome, email, prefisso, nr_telefono]
      properties:
        id: { type: integer, format: int64, description: 'Id nella tabella corrieri, da usare come id_corriere' }
        id_utente: { type: integer, format: int64 }
        id_sede: { type: integer, format: int64, description: Sede in cui lavora il corriere }
        nome: { type: string }
        cognome: { type: string }
        email: { type: string }
        prefisso: { type: string }
        nr_telefono: { type: string }

    ListaCorrieri:
      type: object
      required: [dati, pagina, per_pagina, totale_elementi, totale_pagine]
      properties:
        dati:
          type: array
          items: { $ref: '#/components/schemas/Corriere' }
        pagina: { type: integer }
        per_pagina: { type: integer }
        totale_elementi: { type: integer, minimum: 0, description: Elementi che rispettano i filtri, su tutte le pagine }
        totale_pagine: { type: integer, minimum: 0, description: 'Pagine necessarie con questo per_pagina (0 se non ci sono elementi); una pagina oltre la fine risponde con dati vuoti' }

    ListaClienti:
      type: object
      required: [dati, pagina, per_pagina, totale_elementi, totale_pagine]
      properties:
        dati:
          type: array
          items: { $ref: '#/components/schemas/Cliente' }
        pagina: { type: integer }
        per_pagina: { type: integer }
        totale_elementi: { type: integer, minimum: 0, description: Elementi che rispettano i filtri, su tutte le pagine }
        totale_pagine: { type: integer, minimum: 0, description: 'Pagine necessarie con questo per_pagina (0 se non ci sono elementi); una pagina oltre la fine risponde con dati vuoti' }

    Persona:
      type: object
      required: [nome, cognome]
      description: |
        Dati di un cliente o del corriere, secondo chi chiama:
        - operatore e amministratore: mittente, destinatario e corriere con id, email e telefono;
        - corriere: mittente e destinatario con id, email e telefono; niente corriere;
        - cliente: mittente con nome, cognome, email e telefono (senza id), destinatario con id,
          email e telefono; niente corriere.
      properties:
        id: { type: integer, format: int64, description: 'Id nella tabella clienti o corrieri; assente per il mittente quando chiama il cliente' }
        nome: { type: string }
        cognome: { type: string }
        email: { type: string }
        telefono: { type: string, example: '+39 3330000005' }

    Autore:
      type: object
      required: [ruolo, id]
      properties:
        ruolo: { type: string, enum: [operatore, corriere] }
        id: { type: integer, format: int64 }
        nome: { type: string, description: Presente nello storico e nelle note (non per il cliente) }
        cognome: { type: string, description: Presente nello storico e nelle note (non per il cliente) }

    Motivi:
      type: object
      required: [dati]
      properties:
        dati:
          type: array
          items: { $ref: '#/components/schemas/Motivo' }
          description: |
            Elenco unico dei motivi ammessi, valido per ogni tentativo fallito e per i cambi di
            stato in `annullata` e `persa`: non è filtrato per stato o tipo di tentativo.

    NuovaNota:
      type: object
      required: [nota]
      properties:
        nota: { type: string, minLength: 1, maxLength: 2000 }
      additionalProperties: false

    Nota:
      type: object
      required: [id, is_interna, motivo, creata_il]
      properties:
        id: { type: integer, format: int64 }
        nota:
          type: string
          description: Testo della nota; assente per il cliente, che vede solo il `motivo`
        is_interna:
          type: boolean
          description: '`false` per le note dei tentativi e dei cambi di stato in annullata o persa'

        motivo: { type: string, nullable: true }
        creata_il: { type: string, format: date-time }
        autore:
          allOf: [{ $ref: '#/components/schemas/Autore' }]
          description: Chi ha scritto la nota; assente per il cliente

    VoceElenco:
      type: object
      required:
        - id
        - cod_ordine
        - stato
        - is_reso
        - creata_il
        - dataora_richiesta_spedizione
        - ritirata_il
        - id_cliente_destinatario
        - indirizzo_ritiro
        - indirizzo_spedizione
        - mittente
        - destinatario
        - conclusa_il
        - note
      properties:
        id: { type: integer, format: int64 }
        id_sede: { type: integer, format: int64, description: Sede che gestisce la spedizione }
        sede: { type: string, description: Nome della sede }
        cod_ordine: { type: string }
        stato: { $ref: '#/components/schemas/Stato' }
        is_reso: { type: boolean }
        creata_il: { type: string, format: date-time }
        dataora_richiesta_spedizione: { type: string, format: date-time }
        ritirata_il:
          type: string
          format: date-time
          nullable: true
          description: Data e ora del ritiro, registrate al primo passaggio in `ritirata`; null prima
        id_cliente_mittente:
          type: integer
          format: int64
          description: Assente quando chiama il cliente
        id_cliente_destinatario: { type: integer, format: int64 }
        indirizzo_ritiro: { $ref: '#/components/schemas/Indirizzo' }
        indirizzo_spedizione: { $ref: '#/components/schemas/Indirizzo' }
        mittente: { $ref: '#/components/schemas/Persona' }
        destinatario: { $ref: '#/components/schemas/Persona' }
        id_corriere:
          type: integer
          format: int64
          nullable: true
          description: Presente solo per operatore e amministratore
        corriere:
          allOf: [{ $ref: '#/components/schemas/Persona' }]
          description: Solo per operatore e amministratore, e solo se la spedizione ha un corriere
        assegnata_da:
          allOf: [{ $ref: '#/components/schemas/Persona' }]
          description: |
            Operatore che ha fatto l'assegnazione attuale, con id (tabella operatori_logistici),
            nome, cognome, email e telefono. Per operatore, amministratore e corriere; assente
            per il cliente e per le spedizioni senza corriere.
        conclusa_il:
          type: string
          format: date-time
          nullable: true
          description: Quando la spedizione è entrata nello stato finale; null se è ancora in corso
        note:
          type: array
          items: { $ref: '#/components/schemas/Nota' }

    DettaglioSpedizione:
      allOf:
        - $ref: '#/components/schemas/VoceElenco'
        - type: object
          required: [annullata_il, tentativi_ritiro_falliti, tentativi_consegna_falliti]
          properties:
            annullata_il: { type: string, format: date-time, nullable: true }
            tentativi_ritiro_falliti: { type: integer, minimum: 0 }
            tentativi_consegna_falliti: { type: integer, minimum: 0 }

    ListaSpedizioni:
      type: object
      required: [dati, pagina, per_pagina, totale_elementi, totale_pagine]
      properties:
        dati:
          type: array
          items: { $ref: '#/components/schemas/VoceElenco' }
        pagina: { type: integer, minimum: 1 }
        per_pagina: { type: integer, minimum: 1, maximum: 100 }
        totale_elementi: { type: integer, minimum: 0, description: Elementi che rispettano i filtri, su tutte le pagine }
        totale_pagine: { type: integer, minimum: 0, description: 'Pagine necessarie con questo per_pagina (0 se non ci sono elementi); una pagina oltre la fine risponde con dati vuoti' }

    VoceStorico:
      type: object
      required: [id, operazione, valore_vecchio, valore_nuovo, modificato_il, autore]
      properties:
        id: { type: integer, format: int64 }
        operazione:
          type: string
          enum: [creazione, modifica, annullamento, tentativo]
          description: |
            `tentativo`: un tentativo di ritiro o di consegna fallito, registrato dal corriere
            (`POST /tentativi`); sta nello storico accanto ai cambi di stato, in ordine di tempo
            (a parità di istante prima il tentativo, poi il cambio di stato che ha causato).
            L'`id` è quello del tentativo, non di una modifica.
        valore_vecchio:
          type: object
          nullable: true
          additionalProperties: true
          description: Solo i campi cambiati, col valore precedente; null per la creazione e per i tentativi
        valore_nuovo:
          type: object
          additionalProperties: true
          description: |
            Solo i campi cambiati, col nuovo valore; la riga intera per la creazione. Per un
            tentativo: `tipo` (ritiro o consegna), `esito` (fallito), `motivo` e `nota` del corriere.
        modificato_il: { type: string, format: date-time }
        autore:
          allOf: [{ $ref: '#/components/schemas/Autore' }]
          description: Con nome e cognome di chi ha fatto la modifica

    Storico:
      type: object
      required: [dati]
      properties:
        dati:
          type: array
          items: { $ref: '#/components/schemas/VoceStorico' }

    NuovaPosizione:
      type: object
      additionalProperties: false
      required: [latitudine, longitudine]
      properties:
        latitudine: { type: number, minimum: -90, maximum: 90 }
        longitudine: { type: number, minimum: -180, maximum: 180 }

    Intervallo:
      type: object
      additionalProperties: false
      required: [intervallo_secondi]
      properties:
        intervallo_secondi: { type: integer, minimum: 5, maximum: 3600, example: 30 }

    PosizioneCorriere:
      type: object
      required: [id_corriere, nome, cognome, latitudine, longitudine, rilevata_il, spedizioni_attive]
      properties:
        id_corriere: { type: integer, format: int64 }
        nome: { type: string }
        cognome: { type: string }
        latitudine: { type: number }
        longitudine: { type: number }
        rilevata_il: { type: string, format: date-time }
        spedizioni_attive:
          type: array
          items: { type: integer, format: int64 }

    PosizioniCorrieri:
      type: object
      required: [intervallo_secondi, corrieri]
      properties:
        intervallo_secondi: { type: integer }
        corrieri:
          type: array
          items: { $ref: '#/components/schemas/PosizioneCorriere' }

    Login:
      type: object
      additionalProperties: false
      required: [email, password]
      properties:
        email: { type: string, format: email }
        password: { type: string }
        ruolo:
          type: string
          enum: [operatore, corriere, cliente, amministratore]
          description: Solo se l'utente ha più ruoli

    Sessione:
      type: object
      required: [token, tipo, scade_il, durata_secondi, utente]
      properties:
        token: { type: string }
        tipo: { type: string, enum: [Bearer] }
        scade_il: { type: string, format: date-time }
        durata_secondi:
          type: integer
          description: Durata del token in secondi. Il client programma il rinnovo con il proprio orologio (adesso + durata), senza confrontare scade_il con un orologio del dispositivo che può essere sbagliato.
        utente:
          type: object
          required: [id_utente, ruolo, id, nome, cognome, email]
          properties:
            id_utente: { type: integer, format: int64 }
            ruolo: { type: string, enum: [operatore, corriere, cliente, amministratore] }
            id:
              type: integer
              format: int64
              description: Id nella tabella del ruolo (operatori_logistici, corrieri, clienti, amministratori)
            id_sede:
              type: integer
              format: int64
              description: Sede di operatori e corrieri; assente per clienti e amministratori
            nome: { type: string }
            cognome: { type: string }
            email: { type: string }

    CambioPassword:
      type: object
      additionalProperties: false
      required: [password_attuale, nuova_password]
      properties:
        password_attuale: { type: string }
        nuova_password: { type: string, minLength: 8, description: Da 8 caratteri a 72 byte }

    RecuperoPassword:
      type: object
      additionalProperties: false
      required: [email]
      properties:
        email: { type: string, format: email }

    ReimpostaPassword:
      type: object
      additionalProperties: false
      required: [token, nuova_password]
      properties:
        token: { type: string }
        nuova_password: { type: string, minLength: 8, description: Da 8 caratteri a 72 byte }

    Messaggio:
      type: object
      required: [messaggio]
      properties:
        messaggio: { type: string }

    Impostazioni:
      type: object
      required: [id_sede, giorni_visibilita_cliente, max_tentativi_ritiro, max_tentativi_consegna, intervallo_posizione_sec, modificate_il, id_amministratore_modifica]
      properties:
        id_sede: { type: integer, format: int64 }
        giorni_visibilita_cliente: { type: integer, minimum: 1, maximum: 365, example: 30, description: Per quanti giorni dalla chiusura il cliente destinatario vede una spedizione della sede }
        max_tentativi_ritiro: { type: integer, minimum: 1, maximum: 10, example: 3, description: Ritiri falliti dopo i quali la spedizione va annullata }
        max_tentativi_consegna: { type: integer, minimum: 1, maximum: 10, example: 3, description: Consegne fallite dopo le quali la spedizione diventa non consegnata }
        intervallo_posizione_sec: { type: integer, minimum: 5, maximum: 3600, example: 30, description: Ogni quanti secondi il corriere invia la posizione e la mappa degli operatori si aggiorna }
        modificate_il: { type: string, format: date-time }
        id_amministratore_modifica: { type: integer, format: int64, nullable: true, description: Ultimo amministratore che le ha modificate }

    ModificaImpostazioni:
      type: object
      additionalProperties: false
      minProperties: 1
      properties:
        giorni_visibilita_cliente: { type: integer, minimum: 1, maximum: 365 }
        max_tentativi_ritiro: { type: integer, minimum: 1, maximum: 10 }
        max_tentativi_consegna: { type: integer, minimum: 1, maximum: 10 }
        intervallo_posizione_sec: { type: integer, minimum: 5, maximum: 3600 }

    NuovoMotivo:
      type: object
      additionalProperties: false
      required: [descrizione]
      properties:
        descrizione: { type: string, minLength: 1, maxLength: 100 }

    MotivoGestito:
      type: object
      required: [id, descrizione, attivo, creato_il]
      properties:
        id: { type: integer, format: int64 }
        descrizione: { type: string }
        attivo: { type: boolean, description: Solo i motivi attivi sono in GET /api/motivi e sono accettati }
        creato_il: { type: string, format: date-time }

    ListaMotivi:
      type: object
      required: [dati]
      properties:
        dati:
          type: array
          items: { $ref: '#/components/schemas/MotivoGestito' }

    StatoAttivo:
      type: object
      additionalProperties: false
      required: [attivo]
      properties:
        attivo: { type: boolean }

    ModificaUtente:
      type: object
      additionalProperties: false
      minProperties: 1
      properties:
        nome: { type: string, maxLength: 100 }
        cognome: { type: string, maxLength: 100 }
        prefisso: { type: string, pattern: '^\+[0-9]{1,4}$', example: '+39' }
        nr_telefono: { type: string, pattern: '^[0-9]{4,15}$' }
        email: { type: string, format: email, maxLength: 254 }
        password: { type: string, minLength: 8, description: Nuova password, inviata per mail all'utente }
        attivo: { type: boolean, description: false disattiva l'utente, true lo riabilita }
        id_sede:
          type: integer
          format: int64
          description: |
            Solo l'amministratore, solo per corrieri e operatori (i clienti non hanno sede: 400).
            Sposta l'utente in un'altra sede. Un corriere con spedizioni assegnate, ritirate o in
            consegna non si sposta (409): vanno prima riassegnate. Sede inesistente: 400; sede
            disattivata: 409.

    NuovoUtente:
      type: object
      additionalProperties: false
      required: [ruolo, id_sede, nome, cognome, prefisso, nr_telefono, email, password]
      properties:
        ruolo: { type: string, enum: [corriere, operatore] }
        id_sede: { type: integer, format: int64, description: Sede in cui lavora (inesistente = 400, disattivata = 409) }
        nome: { type: string, maxLength: 100 }
        cognome: { type: string, maxLength: 100 }
        prefisso: { type: string, pattern: '^\+[0-9]{1,4}$', example: '+39' }
        nr_telefono: { type: string, pattern: '^[0-9]{4,15}$' }
        email: { type: string, format: email, maxLength: 254 }
        password:
          type: string
          minLength: 8
          description: Scelta dall'amministratore, viene inviata per mail al nuovo utente

    Utente:
      type: object
      required: [id, ruolo, id_ruolo, nome, cognome, email, prefisso, nr_telefono, attivo]
      properties:
        id: { type: integer, format: int64, description: "Id nella tabella utenti, da usare in /api/utenti/{id}" }
        ruolo: { type: string, enum: [corriere, operatore, cliente] }
        id_ruolo: { type: integer, format: int64, description: 'Id nella tabella corrieri, operatori_logistici o clienti, quello usato nelle spedizioni (es. id_corriere)' }
        id_sede: { type: integer, format: int64, nullable: true, description: 'Sede in cui lavora il corriere o l''operatore; null per i clienti' }
        sede: { type: string, nullable: true, description: 'Nome della sede; null per i clienti' }
        nome: { type: string }
        cognome: { type: string }
        email: { type: string }
        prefisso: { type: string }
        nr_telefono: { type: string }
        attivo: { type: boolean }
        destinatario:
          type: boolean
          nullable: true
          description: |
            Solo per i clienti (null per gli altri): true se è stato destinatario di almeno una
            spedizione e quindi accede all'app, false se è solo mittente

    EsitoUtente:
      type: object
      required: [utente, mail_inviata]
      properties:
        utente: { $ref: '#/components/schemas/Utente' }
        mail_inviata: { type: boolean, description: true se la mail con le credenziali è partita }

    Sede:
      type: object
      required: [id, nome, attiva, indirizzo, gruppo_spedizioni, creata_il]
      properties:
        id: { type: integer, format: int64 }
        nome: { type: string }
        attiva: { type: boolean, description: 'false = non accetta nuove spedizioni né nuovi corrieri o operatori' }
        indirizzo: { $ref: '#/components/schemas/IndirizzoAnagrafica' }
        gruppo_spedizioni:
          type: integer
          minimum: 0
          maximum: 9006
          readOnly: true
          description: |
            Gruppo di sedi: il database delle spedizioni della sede (0 = il principale).
            Si sceglie alla creazione e poi non si cambia.
        creata_il: { type: string, format: date-time }

    NuovaSede:
      type: object
      additionalProperties: false
      required: [nome, indirizzo]
      properties:
        nome: { type: string, maxLength: 100, description: Unico tra le sedi (senza distinguere maiuscole) }
        indirizzo: { $ref: '#/components/schemas/NuovoIndirizzo' }
        gruppo_spedizioni:
          type: integer
          minimum: 0
          maximum: 9006
          default: 0
          description: |
            Gruppo di sedi (database delle spedizioni) della sede; deve avere un database
            configurato nel servizio spedizioni. Non si cambia dopo la creazione.

    ModificaSede:
      type: object
      additionalProperties: false
      description: Almeno un campo; partono solo quelli presenti. `gruppo_spedizioni` non c'è perché non si cambia (se mandato, 400 sul campo `gruppo_spedizioni`).
      properties:
        nome: { type: string, maxLength: 100 }
        indirizzo:
          allOf: [{ $ref: '#/components/schemas/NuovoIndirizzo' }]
          description: Nuovo indirizzo della sede, intero e nella stessa città
        attiva: { type: boolean, description: 'false disattiva la sede, true la riattiva' }

    ListaSedi:
      type: object
      required: [dati, pagina, per_pagina, totale_elementi, totale_pagine]
      properties:
        dati:
          type: array
          items: { $ref: '#/components/schemas/Sede' }
        pagina: { type: integer }
        per_pagina: { type: integer }
        totale_elementi: { type: integer, minimum: 0 }
        totale_pagine: { type: integer, minimum: 0 }

    ListaUtenti:
      type: object
      required: [dati, pagina, per_pagina, totale_elementi, totale_pagine]
      properties:
        dati:
          type: array
          items: { $ref: '#/components/schemas/Utente' }
        pagina: { type: integer }
        per_pagina: { type: integer }
        totale_elementi: { type: integer, minimum: 0, description: Elementi che rispettano i filtri, su tutte le pagine }
        totale_pagine: { type: integer, minimum: 0 }

    Errore:
      type: object
      required: [errore]
      properties:
        errore:
          type: string
          description: Cosa è successo, senza dettagli interni
        dettagli:
          type: array
          description: Per gli errori sui dati, un elemento per ogni campo da correggere
          items:
            type: object
            required: [campo, messaggio]
            properties:
              campo: { type: string, example: nota }
              messaggio: { type: string, example: obbligatoria per un tentativo non riuscito }
